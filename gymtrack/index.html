  if(c.s.pr)confetti();
  // מעתיקים את הערכים לסטים הבאים שעוד ריקים (כמו בטבלה)
  c.en.sets.forEach((x,k)=>{if(k>c.j&&!x.done)['w','r','sec'].forEach(f=>{if(x[f]===''&&c.s[f]!==undefined)x[f]=c.s[f]})});
  save();
  const stp=steps();
  if(PL.k>=stp.length-1){PL.st='done';speak('סיימת את האימון');render();return}
  const nxS=stp[PL.k+1],nx=S.current.entries[nxS.i];
  // בסופרסט: מעבר מהיר לתרגיל המקושר, בלי מנוחה מלאה
  const trans=!!c.en.ss&&ph(c.en)==='m'&&nxS.i!==c.i;
  const rest=trans?8:ph(c.en)==='w'?(ph(nx)==='w'?10:30):restFor(c.en);
  PL.st='rest';PL.trans=trans;PL.restStart=Date.now();PL.total=rest;PL.end=Date.now()+rest*1000;PL.left=rest;PL.lastBeep=-1;PL.paused=false;PL.coachAt=Date.now();

}

function plSkipEx(){

/* מחשבון צלחות: מוט אולימפי 20 ק"ג, צלחות בכל צד לפי המשקל שנבחר */
function platesFor(total,bar){
  let side=(total-bar)/2;if(!(side>0))return null;
  const out=[];for(const p of [25,20,15,10,5,2.5,1.25]){while(side+1e-6>=p){out.push(p);side-=p}}
  return side<.05?out:null;
}
function plateLine(e,s){
  if(figSpec(e).eq!=='bar'||!(+s.w>20))return '';
  const pl=platesFor(+s.w,20);
  return `<div class="mu" style="text-align:center;margin-top:4px">🏋️ מוט 20 + כל צד: ${pl&&pl.length?pl.join(' + '):'משקל לא מדויק לצלחות רגילות'}</div>`;

function plTick(){
  if(!PL||!S.current)return;
  const now=Date.now();
  const el=document.getElementById('pel');if(el)el.textContent=fmtT(Math.floor((now-S.current.start)/1000));
  if(PL.paused)return;
  const c=PL.st==='done'?null:cur();if(!c)return;
  // מאמן תוך כדי תנועה: משפט חדש כל 6 שניות, עם מעבר רך
  const co=document.getElementById('coach');
  if(co&&now-(PL.coachAt||0)>6000){
    PL.coachAt=now;const L=coachList(c);
    if(L.length>1){PL.coachI=((PL.coachI||0)+1)%L.length;const txt=L[PL.coachI];co.classList.add('fade');setTimeout(()=>{co.textContent=txt;co.classList.remove('fade')},350)}
  }
  if(PL.st==='rest'){
    const b=document.getElementById('breathT');if(b)b.textContent=Math.floor((now-PL.restStart)/4000)%2?'נשיפה…':'שאיפה…';
    const pe=document.querySelector('.pl');if(pe)pe.style.setProperty('--rh',Math.round(210-90*(1-PL.left/Math.max(1,PL.total))));
  }
  // מד קצב לחזרות: כדור שיורד ועולה לפי הטמפו, וספירת חזרות
  if(PL.st==='work'&&c.e.type==='s'){
    if(S.settings.pacer===false)return;
    const [a,b,u]=tempoOf(c.en),T=a+b+u,te=(now-PL.workStart)/1000,t=te%T;
    const pos=t<a?t/a:t<a+b?1:1-(t-a-b)/u;
    const ball=document.getElementById('pball');if(ball)ball.style.transform=`translateY(${(pos*68).toFixed(1)}px)`;
    const lb=document.getElementById('plab');if(lb)lb.textContent=t<a?'⬇ למטה':t<a+b?'⏸ החזק':'⬆ למעלה';
    const n=Math.floor(te/T),tg=+c.s.r||0,rc=document.getElementById('prc');
    if(rc)rc.textContent=tg?`חזרה ${Math.min(n+1,tg)} מתוך ${tg}`:'';
    if(tg&&n>=tg&&PL.repBeep!==tg){PL.repBeep=tg;tone(990,140);vib(60);const bt=document.getElementById('pdone');if(bt)bt.classList.add('go')}
    return;
  }
  if(!(PL.st==='ready'||PL.st==='rest'||(PL.st==='work'&&isTimed(c.e))))return;
  const left=Math.max(0,Math.ceil((PL.end-now)/1000));PL.left=left;
  const t=document.getElementById('pt');if(t)t.textContent=left>=60?fmtT(left):left;
  const frac=left/Math.max(1,PL.total),r=document.getElementById('ring');
  if(r){r.setAttribute('stroke-dashoffset',(327*(1-frac)).toFixed(1));r.setAttribute('stroke',ringCol(frac))}
  const rg=document.querySelector('.ring');if(rg)rg.classList.toggle('pulse',left>0&&left<=3);
  if(left>0&&left<=3&&PL.lastBeep!==left){PL.lastBeep=left;tone(700,90)}
  if(left<=0){
    tone(1100,300);vib(200);
    if(PL.st==='ready')plStartWork();else if(PL.st==='work')plSetDone();else plNext();
  }
}

/* חישוב תזונה: BMR לפי Mifflin-St Jeor, כפול רמת פעילות לפי מספר האימונים בשבוע, מותאם למטרה */
function nutri(){
  const p=S.profile||{},kg=S.body.length?+S.body[S.body.length-1].kg:+p.weight||0,age=+p.age||0,h=+p.height||0,sex=p.gender||'x';
  if(!kg||!age||!h)return null;
  const bmr=10*kg+6.25*h-5*age+(sex==='m'?5:sex==='f'?-161:-78);
  const d=(p.days||[]).length||S.settings.goal||3,act=d<=2?1.375:d<=4?1.55:1.725;
  const goal=p.goal||'fit',tdee=bmr*act;
  const kcal=Math.round(tdee*(1+({lose:-.18,abs:-.12,muscle:.1,strength:.05,fit:0}[goal]||0))/10)*10;
  const pr=Math.round(kg*({lose:2,abs:2,muscle:1.8,strength:1.8,fit:1.6}[goal]||1.6)),fat=Math.round(kg*.8);
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,pr,fat,carb:Math.max(0,Math.round((kcal-pr*4-fat*9)/4)),water:Math.round((kg*35+500)/100)/10,goal,kg,act};
}

/* =====================================================================
   חשבון Google וסנכרון בענן: הנתונים נשמרים בתיקייה מוסתרת (appDataFolder) ב-Google Drive של המשתמש.
   אין שרת: רק האפליקציה, עם ההרשאה שהמשתמש נותן, יכולה לקרוא ולכתוב לקובץ הזה
   ===================================================================== */
let GTOK=null,syncing=false;
const SYNC_SCOPES='openid email profile https://www.googleapis.com/auth/drive.appdata';
const DRIVE='https://www.googleapis.com/drive/v3/files',DRIVE_UP='https://www.googleapis.com/upload/drive/v3/files';
function accountCard(){
  const a=S.account;
  if(a)return `<div class="card"><div class="row">${a.pic?`<img src="${esc(a.pic)}" alt="" referrerpolicy="no-referrer" style="width:44px;height:44px;border-radius:50%">`:'<span style="font-size:34px">👤</span>'}<div class="grow"><b>${esc(a.name||'')}</b><div class="mu" dir="ltr" style="text-align:right">${esc(a.email||'')}</div></div></div>
   <div class="mu" style="margin:8px 0">☁️ הנתונים מגובים ב-Google Drive שלך ומסונכרנים בין המכשירים. ${S.settings.lastCloud?'סנכרון אחרון: '+new Date(S.settings.lastCloud).toLocaleString('he-IL'):''}</div>
   <div class="row"><button class="pri grow" onclick="cloudSync()">🔄 סנכרן עכשיו</button><button onclick="gLogout()">התנתק</button></div></div>`;
  return `<div class="card"><b>👤 חשבון וגיבוי בענן</b><div class="mu" style="margin:4px 0 8px">התחבר עם Google כדי לגבות את הנתונים ולהשתמש באפליקציה בטלפון ובמחשב. הנתונים נשמרים בתיקייה מוסתרת ב-Google Drive שלך, ורק האפליקציה יכולה לגשת אליה.</div>
   ${S.settings.gid?'':`<input id="gid2" dir="ltr" placeholder="Google OAuth Client ID" style="margin-bottom:8px">`}
   <button class="pri" style="width:100%" onclick="gLogin()">התחבר עם Google</button></div>`;
}
async function gToken(scope){
  const id=(((document.getElementById('gid2')||{}).value)||S.settings.gid||'').trim();
  if(!id)throw new Error('noid');
  S.settings.gid=id;save();
  await loadGIS();
  return new Promise((res,rej)=>google.accounts.oauth2.initTokenClient({client_id:id,scope,callback:r=>r.error?rej(new Error(r.error)):res(r),error_callback:e=>rej(new Error((e&&e.type)||'popup'))}).requestAccessToken({prompt:''}));
}
const setTok=r=>{GTOK={t:r.access_token,exp:Date.now()+((+r.expires_in||3600)-60)*1000}};
async function gLogin(){
  try{
    setTok(await gToken(SYNC_SCOPES));
    const u=await gFetch(GTOK.t,'https://www.googleapis.com/oauth2/v3/userinfo');
    S.account={name:u.name,email:u.email,pic:u.picture};save();render();
    await cloudSync();
  }catch(e){toast(e.message==='noid'?'צריך קודם Client ID של Google. ההסבר בהגדרות, בחלק של היומן':'ההתחברות נכשלה או בוטלה')}
}
function gLogout(){
  if(!confirm('להתנתק? הנתונים יישארו במכשיר הזה ובגיבוי ב-Google Drive.'))return;
  try{GTOK&&google.accounts.oauth2.revoke(GTOK.t)}catch(e){}
  GTOK=null;delete S.account;save();render();
}
async function driveFind(t){const r=await gFetch(t,`${DRIVE}?spaces=appDataFolder&q=${encodeURIComponent("name='gymtrack.json'")}&fields=files(id,modifiedTime)`);return (r.files||[])[0]||null}
async function driveRead(t,id){const r=await fetch(`${DRIVE}/${id}?alt=media`,{headers:{Authorization:'Bearer '+t}});if(!r.ok)throw new Error('http '+r.status);return r.json()}
async function driveWrite(t,id,obj){
  const body=JSON.stringify(obj);
  if(id){const r=await fetch(`${DRIVE_UP}/${id}?uploadType=media`,{method:'PATCH',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body});if(!r.ok)throw new Error('http '+r.status);return}
  const b='gt'+Date.now(),meta=JSON.stringify({name:'gymtrack.json',parents:['appDataFolder']});
  const r=await fetch(`${DRIVE_UP}?uploadType=multipart`,{method:'POST',headers:{Authorization:'Bearer '+t,'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`});
  if(!r.ok)throw new Error('http '+r.status);
}
/* silent: סנכרון ברקע (אחרי אימון) רק אם יש הרשאה בתוקף, בלי לפתוח חלון התחברות */
async function cloudSync(silent){
  if(syncing||!S.account)return;
  try{
    if(!GTOK||Date.now()>GTOK.exp){if(silent)return;setTok(await gToken(SYNC_SCOPES))}
    syncing=true;
    const f=await driveFind(GTOK.t);
    if(f){const remote=await driveRead(GTOK.t,f.id);S=normalize(mergeStates(S,remote))}
    S.settings.lastCloud=Date.now();save();
    const up=JSON.parse(JSON.stringify(S));delete up.current; // אימון פעיל נשאר במכשיר
    await driveWrite(GTOK.t,f&&f.id,up);
    render();if(!silent)toast('☁️ סונכרן עם Google Drive');
  }catch(e){if(!silent)toast('הסנכרון נכשל ('+e.message+')')}
  finally{syncing=false}
}
/* מיזוג שני מכשירים בלי לאבד נתונים:
   - תרגילים: כל מכשיר יוצר מזהים משלו לאותו תרגיל, לכן מתאימים לפי שם ומתרגמים מזהים
   - אימונים ותוכניות: איחוד לפי מזהה. באימון שנערך בשני המכשירים, הגרסה שעודכנה אחרונה מנצחת
   - מחיקות נשמרות ברשימה (deleted), כדי שאימון שנמחק לא יחזור מהמכשיר השני */
function mergeStates(L,R){

function figSpec(e){

  else if(/במוט|דדליפט|גוד מורנינג|לחיצת חזה$|לחיצת חזה בשיפוע|לחיצה צרה|צרפתית|^סקוואט$|סקוואט קדמי|סמית|^לחיצת כתפיים$|קלין|שרוגס|היפ תראסט/.test(n))eq='bar';
  else if(/איכר/.test(n))eq='db';

  else if(g==='כתפיים')mus=['shoulder'];else if(g==='ידיים')mus=/סלסול/.test(n)?['bi','fore']:['tri'];
  else if(g==='רגליים')mus=/רומני|כיפוף ברכיים/.test(n)?['hams','glutes']:/עקבים/.test(n)?['calves']:/ירכיים/.test(n)?['quads']:['quads','glutes'];

/* אינטרפולציה בין שתי תנוחות */
function fLerp(A,B,k){
  const o={};
  new Set([...Object.keys(A),...Object.keys(B)]).forEach(key=>{
    const a=A[key]??B[key],b=B[key]??A[key];
    if(typeof a==='number')o[key]=a+(b-a)*k;
    else if(Array.isArray(a))o[key]=a.map((v,i)=>v+((b[i]??v)-v)*k);
    else o[key]=k<.5?a:b;
  });

/* התאמת גודל ומרכז לכל תרגיל: תיבה תוחמת של הדמות והציוד בכל טווח התנועה, כך שלא ייחתך בשום זווית */
const F3FIT=new Map();
function f3Fit(e){
  if(F3FIT.has(e.name))return F3FIT.get(e.name);
  const sp=figSpec(e),pt=FIGP[sp.p]||FIGP.squat,pts=[];
  [0,.5,1].forEach(k=>{const sk=f3Skel(pt,k,sp);pts.push(...F3J(sk),...sk.toe);const o=[];f3Gear(pt,sk,sp,k,o);
    o.forEach(s=>{if(s.col==='t')return;if(s.t==='c'){pts.push(s.a,s.b)}else if(s.t==='s'||s.t==='r')pts.push(s.p||s.c);else if(s.t==='l')pts.push(...s.pts);

let F3T=0;
function f3Draw(cv,e,k,yaw,pitch){

    [0,1].forEach(kk=>{const g=[];f3Body(f3Skel(pt,kk,sp),M,g,true);g.forEach(s=>{
      if(s.t==='c'){const A=pj(s.a),B=pj(s.b);ctx.lineWidth=2*s.r*A[3];ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke()}

      const mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2,gr=ctx.createLinearGradient(mx+nx*w/2,my+ny*w/2,mx-nx*w/2,my-ny*w/2);

      ctx.strokeStyle=gr;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();
      if(s.col==='m'){ctx.save();ctx.globalAlpha=.35;ctx.shadowColor='#ef4444';ctx.shadowBlur=6;ctx.stroke();ctx.restore()}

    else if(s.t==='r'){const q=ring(s.c,s.r,'z',28);poly(q);ctx.strokeStyle=c[1];ctx.lineWidth=2.6;ctx.stroke();ctx.strokeStyle=c[0];ctx.lineWidth=.8;ctx.stroke()}
    else if(s.t==='l'){ctx.beginPath();s.pts.forEach((p,i)=>{const A=pj(p);i?ctx.lineTo(A[0],A[1]):ctx.moveTo(A[0],A[1])});ctx.strokeStyle=c[1];ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}

  if(!pt.hold)f3Trail(ctx,pt,sp,k,pj,pal);
}
function f3Trail(ctx,pt,sp,k,pj,pal){
  const N=12,sks=[];for(let i=0;i<=N;i++)sks.push(f3Skel(pt,i/N,sp));

  const a=pick(sks[0]),b=pick(sks[N]),dist=a.map((p,i)=>Math.hypot(...v3s(p,b[i])));
  const mx=Math.max(...dist);if(mx<6)return;

    const arrow=(p,q)=>{const an=Math.atan2(p[1]-q[1],p[0]-q[0]);ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]-6*Math.cos(an-.5),p[1]-6*Math.sin(an-.5));ctx.lineTo(p[0]-6*Math.cos(an+.5),p[1]-6*Math.sin(an+.5));ctx.closePath();ctx.fill()};

function f3Ball(ctx,x,y,r,c){

/* קופסה (גם מסובבת): c מרכז, u/v/w חצאי צלעות. מציירים רק פאות שפונות למצלמה, בגוון לפי כיוון הפאה */
function f3Box(ctx,s,c,cm,pj){
  const ax=[s.u,s.v,s.w];
  [0,1,2].forEach(i=>[-1,1].forEach(sg=>{
    const n=v3n(v3m(ax[i],sg)),zr=n[0]*cm.s+n[2]*cm.c,dd=zr*cm.pc+n[1]*cm.ps;if(dd<=.001)return;
    const fc=v3a(s.c,v3m(ax[i],sg)),A=ax[(i+1)%3],B=ax[(i+2)%3];
    const q=[v3a(v3a(fc,A),B),v3a(v3s(fc,A),B),v3s(v3s(fc,A),B),v3s(v3a(fc,A),B)].map(pj);
    ctx.beginPath();q.forEach((p,j)=>j?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();

}
/* שלב בתנועה לפי טמפו: למטה (a שניות), עצירה (b), למעלה (u), ומנוחה קצרה למעלה (hold) */
function figPhase(t,a,b,u,hold){

  if(x<a+b+u)return {k:1-ease((x-a-b)/u),lab:'⬆ למעלה'};

/* canvas של דמות. sync: בנגן, מסונכרנת לטמפו של הסט */
function figSVG(e,sync,cls){
  return `<canvas class="fig ${cls||''}" width="400" height="372" data-x="${e.id}"${sync?' data-sync="1"':''} role="img" aria-label="הדמיה בתלת-ממד: ${esc(e.name)}"></canvas>`;
}
/* כרטיס הדמיה בסגנון אינפוגרפיקה: שם, דמות מונפשת, שלב התנועה, ושורת סטים/חזרות/מנוחה */
function figCard(e){
  const it=S.plans.flatMap(p=>p.items).find(i=>i.ex===e.id&&i.ph!=='w'),g=goalCfg(),t=e.type;
  const sets=(it&&it.sets)||3,rest=(it&&it.rest)||S.settings.rest||60;
  const vol=t==='t'?`${(it&&it.sec)||30} שניות`:t==='s'?`${(it&&it.reps)||(g.min+'–'+g.max)} חזרות`:`${(it&&it.min)||10} דקות`;
  const muscles=(INFO[e.name]&&INFO[e.name].m)||'',hold=(FIGP[figSpec(e).p]||{}).hold;
  return `<div class="figcard"><div class="figt">${fmtName(e.name)}</div>${figSVG(e)}<div class="figph">⬇ למטה</div>
  <div class="figv"><button class="on" onclick="figView(this,null)">⭐ זווית מומלצת</button><button onclick="figView(this,0)">צד</button><button onclick="figView(this,90)">חזית</button><button onclick="figView(this,-1)">🔄 360°</button></div>
  <div class="fighint">${hold?'':'<span style="color:#f59e0b">┅ מסלול התנועה</span> · צללית שקופה = תנוחת התחלה וסיום · '}אפשר לגרור כדי לסובב</div>

/* מצב מצלמה לכל canvas: זווית מומלצת עם תנודה קלה, גרירה ידנית, או סיבוב מלא */
const F3ST=new WeakMap();
function f3State(cv,e){
  let st=F3ST.get(cv);if(st)return st;
  const b=f3Best(e);st={yaw:b.yaw,pitch:b.pitch,best:b,man:-1e9,hold:0,drag:null};F3ST.set(cv,st);
  cv.addEventListener('pointerdown',ev=>{st.drag=ev.clientX;st.spin=false;st.man=performance.now();try{cv.setPointerCapture(ev.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',ev=>{if(st.drag==null)return;st.yaw-=(ev.clientX-st.drag)*.7;st.drag=ev.clientX;st.man=performance.now()});
  const up=()=>{st.drag=null;st.man=performance.now()};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

let figRAF=0;
function figLoop(){
  const cvs=document.querySelectorAll('canvas.fig[data-x]');

  if(document.hidden){figRAF=0;return}
  const now=performance.now();F3T=now/1000;
  cvs.forEach((cv,idx)=>{
    const e=ex(cv.dataset.x);if(!e)return;
    const rc=cv.getBoundingClientRect();if(rc.bottom<0||rc.top>innerHeight)return;
    const pt=FIGP[figSpec(e).p]||FIGP.squat,st=f3State(cv,e);let ph;
    if(cv.dataset.sync&&PL&&PL.st==='work'&&!PL.paused){const c=cur();const [a,b,u]=c?tempoOf(c.en):[2,0,1];ph=figPhase((Date.now()-PL.workStart)/1000,a,b,u,0)}
    else ph=figPhase(now/1000+idx*.7,1.3,.25,1,.45);

    if(st.spin)st.yaw+=.7;
    else if(st.drag==null&&now-st.man>6000&&now>st.hold){
      const tg=st.best.yaw+8*Math.sin(now/1000*.5);let d=((tg-st.yaw)%360+540)%360-180;st.yaw+=d*.04;st.pitch+=(st.best.pitch-st.pitch)*.04;

function figKick(){if(!figRAF)figRAF=requestAnimationFrame(figLoop)}
/* כפתורי זווית: מומלצת, צד, חזית, או סיבוב מלא. זווית שנבחרה נשמרת עד שבוחרים אחרת */
function figView(b,yaw){
  const card=b.closest(".figcard"),cv=card&&card.querySelector("canvas.fig");if(!cv)return;

}
