<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymTrack">
<title>GymTrack</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--card2:#242832;--tx:#f1f3f7;--mu:#8b92a3;--ac:#4ade80;--ac2:#22c55e;--wr:#fbbf24;--dg:#f87171;--bl:#60a5fa;--r:14px}
@media (prefers-color-scheme:light){:root{--bg:#f4f5f8;--card:#fff;--card2:#eceef3;--tx:#15171c;--mu:#667085;--ac:#16a34a;--ac2:#15803d;--bl:#2563eb}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:140px}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.warm{border-inline-start:4px solid var(--wr)}.card.main{border-inline-start:4px solid var(--ac)}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--card2);color:var(--tx);cursor:pointer}
button.pri{background:var(--ac);color:#06210f;font-weight:700}
button.dg{color:var(--dg)}button.sm{padding:6px 10px;font-size:14px}
input,select{font:inherit;background:var(--card2);color:var(--tx);border:1px solid transparent;border-radius:10px;padding:9px;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--ac)}
.set{display:grid;grid-template-columns:28px 1fr 1fr 1fr 44px;gap:6px;align-items:center;margin:6px 0}
.set .n{color:var(--mu);text-align:center}
.set .prev{color:var(--mu);font-size:12px;text-align:center}
.chk{width:44px;height:40px;padding:0;font-size:20px}
.set.done .chk{background:var(--ac);color:#06210f}
.set.done input{opacity:.6}
.pr{color:var(--wr);font-weight:700;font-size:12px}
.tip{font-size:13px;color:var(--mu);background:var(--card2);border-radius:10px;padding:8px 10px;margin:8px 0}
.fb{font-size:14px;border-radius:10px;padding:8px 10px;margin:8px 0;font-weight:600}
.fb.good{background:rgba(74,222,128,.15);color:var(--ac)}
.fb.bad{background:rgba(248,113,113,.15);color:var(--dg)}
.fb.neu{background:rgba(96,165,250,.15);color:var(--bl)}
.banner{border-radius:var(--r);padding:12px 14px;margin-bottom:12px;background:rgba(251,191,36,.14);border:1px solid rgba(251,191,36,.4)}
.banner b{color:var(--wr)}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin:6px 0 12px}.bar>i{display:block;height:100%;background:var(--ac);transition:width .3s}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--card2);z-index:5}
nav button{flex:1;background:none;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button b{font-size:20px;font-weight:400}nav button.on{color:var(--ac)}
#rest{position:fixed;inset-inline:12px;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--ac);color:#06210f;border-radius:var(--r);padding:10px 14px;display:none;align-items:center;gap:10px;z-index:6;font-weight:700}
#rest.show{display:flex}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--wr);color:#222;padding:10px 16px;border-radius:99px;font-weight:700;z-index:30;display:none;max-width:92vw;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border-radius:var(--r);padding:12px;text-align:center}
.stat b{display:block;font-size:24px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.day{background:var(--card2);border-radius:10px;padding:8px 0;font-size:13px}
.day.on{background:var(--ac);color:#06210f;font-weight:700}.day.today{outline:2px solid var(--mu)}
.day.ev{background:rgba(251,191,36,.3)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:6px 10px;border-radius:99px;background:var(--card2);font-size:14px}
.chip.on{background:var(--ac);color:#06210f}
svg{width:100%;height:auto;display:block}
.empty{text-align:center;color:var(--mu);padding:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.set .n{background:none;padding:0;line-height:1.1;font-size:15px}.set .n small{display:block;font-size:10px;color:var(--dg);opacity:.7}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;margin-inline-start:34px}.steps button{padding:6px 9px;font-size:13px}
.sug{font-size:13px;background:rgba(74,222,128,.12);color:var(--tx);border-radius:10px;padding:8px 10px;margin:8px 0}.sug b{color:var(--ac)}
.feel{display:flex;gap:6px;margin:4px 0 8px}.feel button{flex:1;padding:8px 4px;font-size:13px}.feel button.on{background:var(--ac);color:#06210f;font-weight:700}
.fe{font-size:13px}
.addbtn{width:100%;text-align:start;color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.show{display:flex}
#modal .sheet{background:var(--bg);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#modal .top{position:sticky;top:-16px;background:var(--bg);padding:4px 0 8px;z-index:1}
.pick{display:block;width:100%;text-align:start;background:var(--card);margin:4px 0}
.pick.new{color:var(--ac);font-weight:700}.pg{margin:12px 4px 2px}
#toast button{margin-inline-start:8px;background:#222;color:#fff}
.vol{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.vol .bar{margin:0}
.demo{color:var(--bl);text-decoration:none;font-size:13px;white-space:nowrap}
.cups{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.cups span{font-size:22px;opacity:.25}.cups span.on{opacity:1}
.tpl{text-align:start;width:100%;margin:6px 0;background:var(--card);padding:12px 14px}.tpl b{display:block;color:var(--ac)}.vol .bar>i.lo{background:var(--wr)}.vol .bar>i.hi{background:var(--bl)}
/* שאלון, נגן מודרך, עורך תוכנית ולוח 4 שבועות */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);border-radius:16px;padding:16px;margin:8px 0;font-size:17px;border:2px solid transparent}
.opt.on{border-color:var(--ac);background:rgba(74,222,128,.12)}.opt b{font-size:26px;font-weight:400}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts2 .opt{flex-direction:column;text-align:center;gap:4px;margin:0;padding:18px 8px}
.qz{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 32px)}
.qz h1{font-size:26px;margin:18px 0 6px}.qz .sub{color:var(--mu);margin-bottom:12px}.qz .foot{margin-top:auto;padding-top:16px}
.qtop{display:flex;align-items:center;gap:10px}.qtop .bar{flex:1;margin:0}
.num{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px;margin:8px 0}
.num .lbl{flex:1;font-weight:600}.num button{width:44px;height:44px;font-size:22px;padding:0}.num input{width:84px;text-align:center;font-size:20px;font-weight:700}
.dchips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dchips span{padding:16px 0;text-align:center;border-radius:12px;background:var(--card);font-weight:700;cursor:pointer;border:2px solid transparent}.dchips span.on{background:var(--ac);color:#06210f}
body.quiz nav,body.quiz #rest,body.playing nav,body.playing #rest{display:none}
body.quiz,body.playing{padding-bottom:16px}
.pl{position:fixed;inset:0;max-width:640px;margin:0 auto;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:6px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.segs{display:flex;gap:2px;flex:1}.segs i{flex:1;height:5px;border-radius:3px;background:var(--card2)}.segs i.d{background:var(--ac)}.segs i.c{background:var(--wr)}
.pl h1{font-size:28px;text-align:center;margin:8px 0 2px}
.ring{width:230px;height:230px;margin:8px auto;position:relative}
.ring .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800}
.ring .t small{font-size:15px;font-weight:400;color:var(--mu)}
.big{font-size:20px;padding:18px;width:100%}
.stp{display:flex;direction:ltr;align-items:center;justify-content:center;gap:18px;margin:6px 0}.stp button{width:56px;height:56px;font-size:28px;padding:0;border-radius:50%}.stp b{font-size:56px;min-width:100px;text-align:center}
.pit{border-bottom:1px solid var(--card2);padding:8px 0}
.pit .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.pit label{font-size:12px;color:var(--mu)}.pit input{padding:6px;text-align:center}
.wkgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0}
.wk{border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;background:var(--card2);min-height:46px}
.wk.on{background:var(--ac);color:#06210f;font-weight:700}.wk.rest{opacity:.45}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><span>⏱ מנוחה</span><span id="rt" style="font-size:20px">0:00</span><span class="grow"></span><button class="sm" onclick="addRest(15)">+15</button><button class="sm" onclick="stopRest()">דלג</button></div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"></div>
<nav id="nav"></nav>
<script>
/* קטלוג תרגילים. כל פריט: [שם, סוג (s=כוח, t=זמן בשניות, c=קרדיו, w=חימום), טיפ]. סוג ברירת מחדל: כוח */
const CATALOG=[
{g:'חזה',items:[
 ['לחיצת חזה',,'שכמות צמודות לספסל, מרפקים בזווית ~45°. במכונה: כוון את המושב כך שהידיות בגובה אמצע החזה.'],
 ['לחיצת חזה בשיפוע עליון',,'שיפוע 30°. מדגיש את החזה העליון. אל תרים את הכתפיים לאוזניים.'],
 ['לחיצת חזה בשיפוע תחתון',,'שיפוע שלילי קל. מתאים לחזה התחתון, השתמש בספוטר.'],
 ['לחיצת חזה בדמבלים',,'טווח תנועה גדול יותר מהמוט. רד לאט עד מתיחה בחזה.'],
 ['לחיצת חזה במכונה',,'כוון את המושב כך שהידיות בגובה אמצע החזה. שכמות צמודות לגב.'],
 ['מקבילים (דיפס)',,'הטה את הגוף קדימה לדגש על חזה. רד עד מרפקים ב-90°.'],
 ['פרפר במכונה (Pec Deck)',,'מרפקים בגובה הכתפיים, סגור לאט וחזק בנקודה העליונה.'],
 ['פרפר בדמבלים',,'מרפקים מעט כפופים לאורך כל התנועה. אל תרד נמוך מדי.'],
 ['מעבר בכבל (Cable Crossover)',,'צעד קדימה לייצוב, הנח את הידיים אחת מול השנייה וצבוט את החזה.'],
 ['שכיבות סמיכה',,'גוף ישר כמו קרש, חזה כמעט נוגע ברצפה. מרפקים ~45°.'],
 ['שכיבות סמיכה על ברכיים',,'גרסה קלה: ברכיים על הרצפה, גוף ישר מהברכיים עד הראש. מצוין להתחלה.'],
 ['שכיבות סמיכה בשיפוע (ידיים על ספסל)',,'ידיים על ספסל או שולחן יציב. ככל שהמשטח גבוה יותר, התרגיל קל יותר.'],
 ['שכיבות סמיכה יהלום',,'ידיים יוצרות יהלום מתחת לחזה, מרפקים קרובים לגוף. מדגיש תלת-ראשי.'],
 ['פולאובר בדמבל',,'שכיבה על הספסל, הורד את הדמבל מעל הראש עם מרפקים כמעט ישרים.']
]},
{g:'גב',items:[
 ['מתח',,'אחיזה מעט רחבה מהכתפיים, משוך עם הגב ולא עם הזרועות. במכונת עזר: יותר משקל = יותר עזרה.'],
 ['מתח באחיזה צרה (Chin-up)',,'אחיזה הפוכה וצרה. מעורב יותר דו-ראשי, משוך עד סנטר מעל המוט.'],
 ['פולי עליון (Lat Pulldown)',,'התיישב עם ירכיים נעולות מתחת לכרית, משוך את המוט לעצמות הבריח והישען מעט אחורה.'],
 ['חתירה בכבל בישיבה',,'גב ישר, משוך אל הטבור וצבוט שכמות. אל תתנדנד עם הגוף.'],
 ['חתירה במוט',,'גוף בזווית ~45°, משוך לכיוון הטבור וצבוט שכמות בסוף התנועה.'],
 ['חתירה בדמבל',,'ידיים ורגל על הספסל, משוך את המרפק לכיוון הירך.'],
 ['חתירה במכונת כוח',,'חזה צמוד לכרית, משוך עם הגב ובלי להתכופף.'],
 ['חתירת T-Bar',,'גב ישר, חזה למעלה, משוך אל הבטן העליונה.'],
 ['דדליפט',,'גב ישר, המוט צמוד לרגליים, דחוף דרך העקבים. אל תעגל את הגב.'],
 ['הרמות גב (היפראקסטנשן)',,'עצור כשהגוף בקו ישר. אל תקשת יתר על המידה את הגב התחתון.'],
 ['שרוגס',,'הרם כתפיים ישר למעלה, ללא סיבובים. החזק שנייה למעלה.'],
 ['פייס פול (Face Pull)',,'משוך את החבל אל מול הפנים, מרפקים גבוהים. מצוין לבריאות הכתף.'],
 ['פולאובר בכבל',,'זרועות כמעט ישרות, משוך מלמעלה למטה עם הגב.'],
 ['חתירה הפוכה מתחת לשולחן',,'שכב מתחת לשולחן יציב, אחוז בקצה ומשוך את החזה אליו. גוף ישר כמו קרש.']
]},
{g:'כתפיים',items:[
 ['לחיצת כתפיים',,'ליבה מהודקת ובלי קשת בגב התחתון. במכונה: כוון מושב כך שהידיות בגובה הכתפיים.'],
 ['לחיצת כתפיים בדמבלים',,'מרפקים מעט לפנים, לחץ עד סוף הטווח בלי לנעול בכוח.'],
 ['לחיצת כתפיים במכונה',,'גב צמוד לכרית וכוון את גובה המושב כך שהידיות בגובה הכתפיים.'],
 ['לחיצת ארנולד',,'התחל באחיזה הפוכה וסובב בזמן הלחיצה. משקל קל יותר מלחיצה רגילה.'],
 ['הרמות צד',,'מרפקים מעט כפופים, הרם עד גובה הכתף בלבד. בלי תנופה.'],
 ['הרמות קדמיות',,'הרם עד גובה הכתף, שליטה בירידה.'],
 ['הרמות אחוריות',,'התכופף קדימה והרם הצידה, צבוט שכמות. משקל קל.'],
 ['פרפר הפוך במכונה',,'חזה צמוד לכרית, משוך אחורה עם מרפקים ישרים יחסית.'],
 ['חתירה זקופה',,'משוך את המוט עד גובה החזה, מרפקים מעל הידיים.'],
 ['שכיבות סמיכה פייק (כתפיים)',,'אגן גבוה בצורת V הפוכה, הורד את הראש לכיוון הרצפה. מדגיש כתפיים.']
]},
{g:'ידיים',items:[
 ['סלסול דו-ראשי במוט',,'מרפקים צמודים לגוף, בלי להתנדנד. רד לאט.'],
 ['סלסול דו-ראשי בדמבלים',,'סובב את כף היד תוך כדי הרמה (סופינציה).'],
 ['סלסול פטיש',,'אחיזה ניטרלית. מתאים גם לאמות ולשריר הברכיאלי.'],
 ['סלסול בספסל סקוט',,'הזרוע על הכרית, אל תנעל את המרפק למטה.'],
 ['סלסול בכבל',,'מתח קבוע לאורך כל התנועה. מרפקים צמודים.'],
 ['פשיטת מרפקים בכבל (Pushdown)',,'מרפקים צמודים לגוף, פשוט עד הסוף וצבוט את התלת.'],
 ['פשיטת מרפקים מעל הראש',,'מרפקים פונים קדימה וצמודים לראש. יציב ואיטי.'],
 ['לחיצה צרה',,'אחיזה כרוחב הכתפיים, מרפקים קרובים לגוף.'],
 ['מקבילים לתלת ראשי',,'גוף זקוף, מרפקים אחורה וצמודים.'],
 ['לחיצה צרפתית (French Press)',,'מרפקים קבועים, הורד את המוט לכיוון המצח.'],
 ['סלסול שורש כף היד',,'משקל קל, טווח מלא, מתאים לחיזוק האמות.'],
 ['מקבילים על כיסא',,'ידיים על קצה כיסא יציב, רד עד מרפקים ב-90°. רגליים ישרות = יותר קשה.']
]},
{g:'רגליים',items:[
 ['סקוואט',,'רגליים ברוחב כתפיים, ברכיים בכיוון הבהונות, ירידה עד מקביל. במכונת סמית׳ הרחק מעט את הרגליים קדימה.'],
 ['סקוואט קדמי',,'מרפקים גבוהים, גו זקוף. מדגיש את הארבע-ראשי.'],
 ['סקוואט גביע (Goblet)',,'החזק דמבל או קטלבל בחזה. מצוין לשיפור טכניקה.'],
 ['סקוואט בסמית׳',,'הרגליים מעט לפני המוט, עקבים על הרצפה.'],

<script>
const DAYS=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const KEY='gymtrack.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
let S=load();
let tab='today', histEx=null, openPlan=null;

function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  return normalize(s);
}
function normalize(s){
  if(!s||!s.exercises)s={exercises:[],plans:[],workouts:[],current:null,settings:{rest:90,goal:3}};
  // השלמת תרגילי ברירת מחדל וטיפים
  CATALOG.forEach(({g,items})=>items.forEach(([name,type,tip])=>{
    type=type||'s';
    const e=s.exercises.find(x=>x.name===name);
    if(!e)s.exercises.push({id:uid(),name,type,tip,grp:g});
    else{
      if(!e.tip)e.tip=tip;if(!e.grp)e.grp=g;
      // מיגרציה: פלנק היה מוגדר ככוח (ק"ג וחזרות), עכשיו תרגיל זמן
      if(type==='t'&&e.type==='s'){e.type='t';e.tip=tip}
    }
  }));
  s.exercises.forEach(e=>{if(!e.grp)e.grp='אחר'});
  // מיגרציה: פריטי תוכנית -> {ex,ph}
  s.plans.forEach(p=>p.items=p.items.map(i=>typeof i==='string'?{ex:i,ph:'m'}:i));
  s.cal=s.cal||[];s.body=s.body||[];s.water=s.water||{};
  return s;
}
/* ---------- אחסון: localStorage + עותק ב-IndexedDB, ובקשת אחסון קבוע ---------- */
const idb=(mode,fn)=>new Promise((res,rej)=>{
  if(!window.indexedDB)return rej(new Error('no idb'));
  const r=indexedDB.open('gymtrack',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onerror=()=>rej(r.error);
  r.onsuccess=()=>{const tx=r.result.transaction('kv',mode),q=fn(tx.objectStore('kv'));tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)};
});
function save(){
  S.savedAt=Date.now();
  const json=JSON.stringify(S);
  let ok=false;try{localStorage.setItem(KEY,json);ok=true}catch(e){}
  idb('readwrite',st=>st.put(json,KEY)).catch(()=>{if(!ok)toast('שמירה נכשלה')});
}
/* אם ה-localStorage נמחק (למשל ניקוי של Safari) אבל העותק ב-IndexedDB שרד, משחזרים ממנו */
async function restoreFromIDB(){
  try{
    const j=await idb('readonly',st=>st.get(KEY));if(!j)return;
    const d=JSON.parse(j);
    if(d&&d.exercises&&(d.savedAt||0)>(S.savedAt||0)){S=normalize(d);if(QZ&&(S.workouts.length||S.plans.length)){QZ=null;tab='today'}save();render();if(S.current&&S.current.restEnd>Date.now())resumeRest()}
  }catch(e){}
}
async function askPersist(){
  try{if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted()))S.settings.persisted=await navigator.storage.persist();else if(navigator.storage&&navigator.storage.persisted)S.settings.persisted=await navigator.storage.persisted()}catch(e){}
}
const needsBackup=()=>S.workouts.length>=3&&Date.now()-(S.settings.lastBackup||S.workouts[0].start)>14*864e5;
const ex=id=>S.exercises.find(e=>e.id===id)||{name:'?',type:'s'};
const e1rm=(w,r)=>w*(1+r/30);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=t=>new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'short'});
const startOfWeek=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()};
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(str,n)=>{const d=new Date(str+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const ph=e=>e.ph||'m';

/* ---------- history helpers (חימום לא נספר בשיאים ובנפח) ---------- */
/* האימונים שמולם משווים. בעריכת אימון שנשמר: רק אימונים שלפניו, ולא הוא עצמו */
const pastWorkouts=()=>{const c=S.current;return c&&c.editId?S.workouts.filter(w=>w.id!==c.editId&&w.start<c.start):S.workouts};
function lastSets(exId,phase='m',skipDeload){
  const H=pastWorkouts();
  for(let i=H.length-1;i>=0;i--){
    if(skipDeload&&H[i].deload)continue;
    const en=H[i].entries.find(e=>e.exId===exId&&ph(e)===phase);
    if(en){const d=en.sets.filter(s=>s.done);if(d.length)return d}
  }return null;
}
/* ערך להשוואה בין סטים: 1RM משוער, חזרות (משקל גוף, 0 ק"ג) או שניות (תרגיל זמן) */
const isBW=s=>!(+s.w>0);
const setScore=(e,s)=>e.type==='t'?(+s.sec||0):isBW(s)?(+s.r||0):e1rm(+s.w,+s.r);
const fmtSet=(e,s)=>e.type==='t'?`${s.sec} שנ׳`:isBW(s)?`${s.r} חזרות`:`${s.w}×${s.r}`;
function bestScore(exId,bw){
  const e=ex(exId);let b=0;
  pastWorkouts().forEach(w=>w.entries.forEach(en=>{if(en.exId===exId&&ph(en)==='m')en.sets.forEach(s=>{if(s.done&&(e.type==='t'||isBW(s)===bw))b=Math.max(b,setScore(e,s))})}));
  return b;
}

/* ---------- מנוע התקדמות (Double Progression) ----------
   עובדים בטווח חזרות לפי המטרה (מסה: 8–12). כשכל הסטים הגיעו לקצה העליון, מעלים משקל וחוזרים לקצה התחתון.
   התחושה שסימנת אחרי הסט (😌 קל / 😤 מאתגר / 🥵 עד הקצה) מזרזת או מאטה את ההתקדמות.
   כל שבוע רביעי (ניתן לשינוי) הוא שבוע הקלה: משקל מופחת ופחות סטים */
const GOALS={hyp:{l:'מסה ונפח שריר',min:8,max:12,vol:[10,20]},str:{l:'כוח',min:3,max:6,vol:[6,12]},end:{l:'סיבולת וכושר',min:12,max:15,vol:[8,16]}};
const goalCfg=()=>GOALS[S.settings.goalType]||GOALS.hyp;
const incFor=w=>w>=40?2.5:1;
const roundTo=(v,st)=>Math.round(v/st)*st;
const FEEL=[null,'😌','😤','🥵'];
function weekNo(t){return S.workouts.length?Math.round((startOfWeek(t)-startOfWeek(S.workouts[0].start))/(7*864e5))+1:1}
function isDeloadWeek(t){const n=S.settings.deload??4;return !!n&&S.workouts.length>0&&weekNo(t)%n===0}
function suggest(exId){
  const e=ex(exId),g=goalCfg(),prev=lastSets(exId,'m',true);
  if(!prev||(e.type!=='s'&&e.type!=='t'))return null;
  const n=prev.length,hard=prev.some(s=>s.feel===3),easy=prev.every(s=>s.feel===1),add=hard?0:easy?2:1;
  if(isDeloadWeek(S.current?S.current.start:Date.now())){
    const why='🧘 שבוע הקלה: פחות משקל ופחות סטים, כדי שהגוף יתאושש ויחזור חזק יותר';
    const dn=Math.max(2,Math.ceil(n*.6));
    if(e.type==='t')return {sec:Math.round(Math.max(...prev.map(s=>+s.sec||0))*.8),n:dn,why};
    const top=Math.max(...prev.map(s=>+s.w||0));
    return top>0?{w:roundTo(top*.9,incFor(top)),r:g.min,n:dn,why}:{w:0,r:Math.max(1,Math.round(Math.min(...prev.map(s=>+s.r||0))*.7)),n:dn,why};
  }
  if(e.type==='t'){
    const sec=Math.max(...prev.map(s=>+s.sec||0)),a=add*5;
    return {sec:sec+a,n,why:a?`בפעם הקודמת ${sec} שנ׳${easy?' והרגיש קל':''}. נסה ${sec+a}`:`בפעם הקודמת ${sec} שנ׳ עד הקצה. נסה שוב אותו זמן`};
  }
  const top=Math.max(...prev.map(s=>+s.w||0)),minR=Math.min(...prev.filter(s=>(+s.w||0)===top).map(s=>+s.r||0));
  if(top===0){
    if(minR>=g.max+3)return {w:0,r:minR,n,why:`${minR} חזרות במשקל גוף: הגיע הזמן להוסיף משקל (חגורה או אפוד) או לעבור לגרסה קשה יותר`};
    return {w:0,r:minR+add,n,why:add?`בפעם הקודמת ${minR} חזרות. נסה ${minR+add}`:`בפעם הקודמת ${minR} חזרות עד הקצה. נסה שוב אותו מספר`};
  }
  if(minR>=g.max&&!hard){const w=top+incFor(top);return {w,r:g.min,n,why:`הגעת ל-${g.max} חזרות בכל הסטים 👏 עולים ל-${w} ק"ג וחוזרים ל-${g.min} חזרות`}}
  if(minR<g.min&&hard){const w=roundTo(top*.95,incFor(top));return {w,r:g.min,n,why:`בפעם הקודמת ${top}×${minR} עד הקצה, מתחת לטווח. מורידים ל-${w} ק"ג כדי לעבוד נקי ב-${g.min}–${g.max}`}}
  const r=Math.min(g.max,Math.max(g.min,minR+add));
  return {w:top,r,n,why:r>minR?`בפעם הקודמת ${top}×${minR}. נשארים במשקל ומוסיפים חזרות (${r})`:`בפעם הקודמת ${top}×${minR}. נשארים על אותו משקל וחזרות`};
}
/* סטים לקבוצת שרירים בשבוע (רק אימון, בלי חימום) */
function weeklySets(wk){

  S.workouts.filter(w=>w.start>=wk&&w.start<wk+7*864e5).forEach(w=>w.entries.forEach(en=>{
    const e=ex(en.exId);if(ph(en)==='m'&&(e.type==='s'||e.type==='t'))out[e.grp||'אחר']=(out[e.grp||'אחר']||0)+en.sets.filter(s=>s.done).length;
  }));

}
/* אחוז שינוי מול הפעם הקודמת. משקל גוף מושווה לפי חזרות, תרגיל זמן לפי שניות */
function progressPct(e,s,p){
  if(e.type==='t')return p.sec>0?(s.sec-p.sec)/p.sec*100:0;
  const sw=+s.w||0,pw=+p.w||0;
  if(sw>0&&pw>0)return (e1rm(sw,s.r)-e1rm(pw,p.r))/e1rm(pw,p.r)*100;
  if(sw===pw)return p.r>0?(s.r-p.r)/p.r*100:0;
  // עבר ממשקל גוף לתוספת משקל (או להפך): לפי כיוון המשקל, כל עוד החזרות לא ירדו
  return sw>pw?(s.r>=p.r?5:0):(s.r>p.r?0:-5);
}

const eventsOn=d=>S.cal.filter(e=>e.start<=d&&d<=e.end);
function blockedDays(wk){let n=0;for(let i=0;i<7;i++){const d=new Date(wk);d.setDate(d.getDate()+i);if(eventsOn(ymd(d)).length)n++}return n}
const weekGoal=wk=>Math.round(S.settings.goal*(7-blockedDays(wk))/7);
/* זיהוי לפי מילים שלמות: "חג" לא יתפוס "חגיגת יום הולדת", ו-"trip" לא יתפוס "strip".
   W(...) = מילה עברית שלמה, עם תחילית אופציונלית (ה/ב/ל/ו/מ/ש/כ) */
const W=src=>new RegExp('(^|[^א-ת])[הבלומשכ]?(?:'+src+')(?![א-ת])','i');
const HOLIDAY=[W('חג|ערב חג|חול המועד|פסח|סוכות|שבועות|ראש השנה|יום כיפור|יום הכיפורים|כיפור|חנוכה|פורים|יום העצמאות|שמחת תורה|שמיני עצרת'),/\b(holiday|christmas|easter|passover|rosh hashana\w*|yom kippur|sukkot|shavuot|hanukkah|chanukah|purim|independence day)\b/i];
const VACATION=[W('חופש|חופשה|חופשת|טיסה|טיסת|נופש|מילואים|חו"ל|חו״ל'),/\b(vacation|vacay|annual leave|day off|days off|pto|ooo|out of office|flight|trip)\b/i];
function classify(t){
  if(HOLIDAY.some(r=>r.test(t)))return 'holiday';
  if(VACATION.some(r=>r.test(t)))return 'vacation';
  return null;
}
function parseICS(t){
  t=t.replace(/\r?\n[ \t]/g,'');const out=[];
  t.split('BEGIN:VEVENT').slice(1).forEach(b=>{
    const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim():''};
    const s=g('DTSTART'),e=g('DTEND'),title=g('SUMMARY').replace(/\\,/g,',').replace(/\\n/g,' ');
    if(!s||!title)return;
    const kind=classify(title);if(!kind)return;
    const f=x=>x.slice(0,4)+'-'+x.slice(4,6)+'-'+x.slice(6,8);
    const start=f(s);let end=e?f(e):start;
    if(!s.includes('T')&&e)end=addDays(end,-1);
    if(end<start)end=start;
    out.push({id:uid(),title,start,end,kind});
  });
  return out;
}
function importICS(f){
  if(!f)return;
  f.text().then(t=>{
    const today=ymd(Date.now()),lim=addDays(today,400);
    const ev=parseICS(t).filter(e=>e.end>=addDays(today,-30)&&e.start<=lim);
    let added=0;
    ev.forEach(e=>{if(!S.cal.some(c=>c.title===e.title&&c.start===e.start)){S.cal.push(e);added++}});
    save();render();toast(added?`נוספו ${added} אירועים מהיומן`:'לא נמצאו חגים או חופשות חדשים בקובץ');
  }).catch(()=>toast('קובץ לא תקין'));
}

async function gSyncWithToken(token){
  const tmin=new Date(Date.now()-7*864e5).toISOString(),tmax=new Date(Date.now()+120*864e5).toISOString();
  const cals=(await gFetch(token,'https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader')).items||[];

/* o = יעדים מפריט בתוכנית: sets, reps, sec, min, rest. מנוע ההתקדמות קובע משקל וחזרות לפי ההיסטוריה,
   והתוכנית קובעת מספר סטים והפסקה. לתרגיל חדש בלי היסטוריה משתמשים ביעדי התוכנית */
function newEntry(exId,phase,o){
  o=o||{};const e=ex(exId);phase=phase||(e.type==='w'?'w':'m');
  const prev=lastSets(exId,phase),l=prev&&prev[prev.length-1],rest=o.rest;
  let base;
  if(phase==='m'&&(e.type==='s'||e.type==='t')){
    const sg=suggest(exId);
    if(sg){const b=e.type==='t'?{sec:sg.sec,done:false}:{w:sg.w,r:sg.r,done:false};return {exId,ph:phase,rest,sug:sg.why,sets:Array.from({length:o.sets||sg.n},()=>({...b}))}}
    // תרגיל חדש: 3 סטים (או לפי התוכנית). מה שתמלא בסט הראשון יועתק לשאר
    if(!l){const b=e.type==='t'?{sec:o.sec||'',done:false}:{w:'',r:o.reps||'',done:false};return {exId,ph:phase,rest,sets:Array.from({length:o.sets||3},()=>({...b}))}}
  }
  if(e.type==='s')base={w:l?l.w:'',r:o.reps||(l?l.r:''),done:false};
  else if(e.type==='t')base={sec:o.sec||(l?l.sec:''),done:false};
  else if(e.type==='c')base={min:o.min||(l?l.min:''),km:l?l.km:'',done:false};
  else base={min:o.min||(l?l.min:(phase==='w'?5:'')),done:false};
  return {exId,ph:phase,rest,sets:Array.from({length:Math.max(1,o.sets||1)},()=>({...base}))};
}

    if(!p||!(p.km>0)||!(s.km>0))return {t:'neu',m:'🆕 קו בסיס ראשון, בפעם הבאה נשווה קצב'};
    const a=s.min/s.km,b=p.min/p.km,d=(b-a)/b*100;
    if(d>=2)return {t:'good',m:`👏 קצב מהיר ב-${d.toFixed(0)}% מהפעם הקודמת (${a.toFixed(1)} דק׳/ק"מ)`};
    if(d<=-5)return {t:'bad',m:`⚠️ קצב איטי ב-${(-d).toFixed(0)}% מהפעם הקודמת. אולי עייפות? אפשר לשמור על קצב נוח היום`};
    return {t:'neu',m:'✔ קצב דומה לפעם הקודמת'};
  }
  if(S.current&&S.current.deload)return {t:'neu',m:'🧘 שבוע הקלה: לא משווים לפעם הקודמת. המטרה היא תנועה נקייה והתאוששות'};
  let msg=null;
  if(!p)msg={t:'neu',m:'🆕 קו בסיס ראשון לתרגיל, בפעם הבאה נשווה'};
  else{
    const d=progressPct(e,s,p),cur=fmtSet(e,s),was=fmtSet(e,p);
    if(d>=1)msg={t:'good',m:`👏 התקדמות: ${cur} מול ${was} בפעם הקודמת (+${d.toFixed(0)}%)`};
    else if(d<=-3)msg={t:'bad',m:`⚠️ ירידה של ${(-d).toFixed(0)}% מול ${was}. ${e.type==='t'||isBW(s)?'הארך מנוחה ל-2–3 דקות':'הארך מנוחה ל-2–3 דקות או הורד כ-5% מהמשקל'}`};
    else msg={t:'neu',m:`✔ שמרת על הרמה של הפעם הקודמת (${was})`};
  }
  if(e.type==='t')return msg;
  const first=en.sets[0];
  if(j>0&&first.done&&s.r<=first.r-3&&msg.t!=='bad')msg={t:'bad',m:`⚠️ ירידה של ${first.r-s.r} חזרות מהסט הראשון, סימן לעייפות. הארך את המנוחה`};
  else if(s.r>=goalCfg().max&&msg.t!=='bad')msg.m+=isBW(s)?` · 💡 ${goalCfg().max}+ חזרות: אפשר להוסיף משקל (חגורה או אפוד) או לעבור לגרסה קשה יותר`:` · 💡 ${goalCfg().max}+ חזרות: אפשר להוסיף ${incFor(+s.w)} ק"ג בסט הבא`;
  return msg;
}
/* סימון סט כבוצע: ולידציה, חיווי, שיא אישי ושאלת תחושה. משותף לטבלה ולנגן המודרך */
function completeSet(i,j){
  const en=S.current.entries[i],s=en.sets[j],e=ex(en.exId);
  if(e.type==='s'&&(!(s.w>=0)||!s.r)){toast('מלא משקל (0 למשקל גוף) וחזרות');return false}
  if(e.type==='t'&&!(s.sec>0)){toast('מלא משך בשניות');return false}
  if((e.type==='c'||e.type==='w')&&!(s.min>0)){toast('מלא משך זמן');return false}
  s.done=true;unlockAudio();
  en.fb=feedback(en,j);
  if((e.type==='s'||e.type==='t')&&ph(en)==='m'){
    const b=bestScore(en.exId,isBW(s)),cur=en.sets.filter((x,k)=>k!==j&&x.done&&x.pr).length;
    if(b>0&&setScore(e,s)>b+0.01&&!cur){s.pr=true;en.fb={t:'good',m:'🏆 שיא אישי חדש בתרגיל!'};toast('🏆 שיא אישי חדש!')}
    en.ask=j;
  }
  return true;
}
const restFor=en=>en.rest||(ph(en)==='w'?45:S.settings.rest);
function toggleSet(i,j){
  const en=S.current.entries[i],s=en.sets[j],e=ex(en.exId);
  if(s.done){s.done=false;delete s.pr;delete s.feel;en.fb=null;if(en.ask===j)delete en.ask;save();render();return}
  if(!completeSet(i,j))return;
  if((e.type==='s'||e.type==='t')&&!S.current.editId)startRest(restFor(en));
  save();render();
}
/* תחושה אחרי סט: משפיעה על ההמלצה לפעם הבאה, וגם על הסט הבא באותו אימון */
function setFeel(i,j,f){
  const en=S.current.entries[i],s=en.sets[j],e=ex(en.exId),nx=en.sets[j+1];
  s.feel=f;delete en.ask;
  let tip='';
  if(nx&&!nx.done){
    if(f===1&&e.type==='s'&&+s.w>0&&+nx.w===+s.w){nx.w=+s.w+incFor(+s.w);tip=`😌 הרגיש קל: העליתי את סט ${j+2} ל-${nx.w} ק"ג`}
    else if(f===1&&e.type==='t'&&+nx.sec===+s.sec){nx.sec=+s.sec+5;tip=`😌 הרגיש קל: סט ${j+2} יהיה ${nx.sec} שנ׳`}
    else if(f===3){tip='🥵 עד הקצה: אל תעלה משקל בסט הבא. הוספתי 30 שניות מנוחה';if(PL&&PL.st==='rest')plAddRest(30);else if(document.getElementById('rest').classList.contains('show'))addRest(30)}
  }
  if(tip)en.fb={t:f===3?'neu':'good',m:tip};
  save();render();
}

/* ---------- rest timer ---------- */
/* זמן הסיום נשמר באימון הנוכחי, כך שהטיימר ממשיך גם אחרי ריענון או חזרה לאפליקציה.
   בזמן אימון המסך נשאר דולק (Wake Lock), כי דפדפן בטלפון מקפיא טיימרים כשהמסך כבוי.
   בסוף המנוחה: צפצוף, רטט, והתראה אם האפליקציה ברקע */
let restEnd=0,restIv=null,actx=null,wakeLock=null;
function startRest(sec){
  restEnd=Date.now()+sec*1000;if(S.current){S.current.restEnd=restEnd;save()}
  askNotify();resumeRest();
}
function resumeRest(){
  if(S.current&&S.current.restEnd)restEnd=S.current.restEnd;
  document.getElementById('rest').classList.add('show');clearInterval(restIv);restIv=setInterval(tickRest,250);tickRest();
}
function addRest(s){restEnd+=s*1000;if(S.current){S.current.restEnd=restEnd;save()}tickRest()}
function stopRest(){clearInterval(restIv);document.getElementById('rest').classList.remove('show');if(S.current&&S.current.restEnd){delete S.current.restEnd;save()}}
function tickRest(){
  const left=Math.ceil((restEnd-Date.now())/1000);
  if(left<=0){restDone(left>-30);stopRest();return}
  document.getElementById('rt').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
}
function restDone(fresh){
  if(!fresh)return; // הטיימר נגמר מזמן (למשל בזמן שהאפליקציה הייתה סגורה): לא מצפצפים באיחור
  vib([200,100,200]);
  beep();announceNext();
  if(document.hidden&&window.Notification&&Notification.permission==='granted'&&navigator.serviceWorker)
    navigator.serviceWorker.ready.then(r=>r.showNotification('⏱ המנוחה נגמרה',{body:'הגיע הזמן לסט הבא 💪',tag:'rest',renotify:true,vibrate:[200,100,200]})).catch(()=>{});
}
/* Web Audio צריך "לשחרר" בלחיצה של המשתמש, לכן נקרא מ-toggleSet */
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){
  if(!actx||S.settings.sound===false)return;
  try{[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.setValueAtTime(.25,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.18);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+.2)})}catch(e){}
}
function askNotify(){try{if(window.Notification&&Notification.permission==='default'&&!S.settings.askedNotify){S.settings.askedNotify=true;Notification.requestPermission()}}catch(e){}}
async function syncWakeLock(){
  try{
    if(S.current&&S.settings.wake!==false&&!document.hidden&&'wakeLock' in navigator){if(!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}
    else if(wakeLock){await wakeLock.release();wakeLock=null}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{syncWakeLock();if(!document.hidden&&S.current&&S.current.restEnd)resumeRest()});
let tt;function toast(m,undoLabel){
  const t=document.getElementById('toast');t.textContent=m;
  if(undoLabel){const b=document.createElement('button');b.className='sm';b.textContent=undoLabel;b.onclick=doUndo;t.appendChild(b)}
  t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none';if(undoLabel)undoFn=null},undoLabel?5000:3200);
}

/* ---------- stats ---------- */
function streak(){
  const counts={};
  S.workouts.forEach(w=>{const k=startOfWeek(w.start);counts[k]=(counts[k]||0)+1});
  const first=S.workouts.length?startOfWeek(S.workouts[0].start):0;
  let wk=startOfWeek(Date.now()),n=0;
  const g0=weekGoal(wk);if(g0>0&&(counts[wk]||0)>=g0)n++;
  wk-=7*864e5;
  while(wk>=first-7*864e5){
    const g=weekGoal(wk);
    if(g>0){if((counts[wk]||0)>=g)n++;else break}
    wk-=7*864e5;
  }
  return n;
}

    const list=phase=>p.items.map((it,i)=>(it.ph||'m')===phase?planRow(p,it,i):'').join('')||'<div class="mu">עדיין אין תרגילים</div>';

    <h2>🔥 חימום</h2>${list('w')}
    <button class="addbtn" style="margin-top:8px" onclick="openPicker('${p.id}','w')">🔍 + הוסף חימום…</button>
    <h2>💪 אימון</h2>${list('m')}
    <button class="addbtn" style="margin-top:8px" onclick="openPicker('${p.id}','m')">🔍 + הוסף תרגיל…</button>
    </div><div class="row"><button class="pri grow" onclick="openPlan=null;render()">סיום</button><button class="dg" onclick="planRemove('${p.id}')">מחק תוכנית</button></div>`;
  }
  return `<h1>תוכניות</h1><button class="pri" style="width:100%;margin-bottom:12px" onclick="openTemplates()">📚 תוכניות מוכנות לפי רמה</button><button style="width:100%;margin-bottom:12px" onclick="quizStart()">🧭 בנה לי תכנית (שאלון מהיר)</button>`+programGrid()+(S.plans.map(p=>`<div class="card row sp" onclick="openPlan='${p.id}';render()"><div><b>${esc(p.name)}</b><div class="mu">${p.days.map(d=>DAYS[d]).join(' ')||'ללא ימים קבועים'} · ${p.items.filter(i=>i.ph==='w').length} חימום · ${p.items.filter(i=>i.ph!=='w').length} אימון</div></div><span class="mu">‹</span></div>`).join('')||'<div class="empty">צור תוכנית ראשונה, למשל "דחיפה" או "רגליים"</div>')
  +`<button class="pri" style="width:100%" onclick="planNew()">+ תוכנית חדשה</button>
  <h2>ספריית התרגילים (${S.exercises.length})</h2>`+CAT_ORDER.map(g=>{
    const l=S.exercises.filter(e=>(e.grp||'אחר')===g);
    return l.length?`<details class="card"><summary><b>${g}</b> <span class="mu">· ${l.length}</span></summary><div class="chips" style="margin-top:8px">${l.map(e=>`<span class="chip">${esc(e.name)} ${e.type==='c'?'🏃':e.type==='w'?'🔥':e.type==='t'?'⏱':''}${e.custom||g==='אחר'?` <a onclick="exDel('${e.id}')" style="color:var(--dg);cursor:pointer">✕</a>`:''}</span>`).join('')}</div></details>`:'';
  }).join('')+`
  <button style="width:100%;margin-top:10px" onclick="openPicker(null,'m',true)">✏️ הוסף תרגיל משלך</button>`;
}
/* ---------- בחירת תרגיל: חיפוש, רשימה לפי קבוצות, וטופס לתרגיל חדש ----------
   target: 'current' (האימון הפעיל), מזהה תוכנית, או null (רק הוספה לספרייה) */
let modal=null;
function openPicker(target,phase,form){modal={target,phase,q:'',form:!!form};renderModal();setTimeout(()=>{const i=document.getElementById(form?'fn':'pq');i&&i.focus()},60)}
function closeModal(){modal=null;renderModal()}
function renderModal(){
  const m=document.getElementById('modal');
  if(!modal){m.classList.remove('show');m.innerHTML='';return}
  m.classList.add('show');
  m.innerHTML=`<div class="sheet">${modal.form?exForm():`<div class="top row"><input id="pq" type="search" placeholder="🔍 חיפוש תרגיל או קבוצת שרירים" value="${esc(modal.q)}" oninput="modal.q=this.value;pickList()"><button onclick="closeModal()">סגור</button></div><div id="plist"></div>`}</div>`;
  if(!modal.form)pickList();
}
const typeIcon=t=>({t:'⏱',c:'🏃',w:'🔥'})[t]||'';
function pickList(){
  const q=modal.q.trim().toLowerCase(),warm=modal.phase==='w',filt=warm?()=>true:e=>e.type!=='w';
  const order=warm?['חימום וניידות',...CAT_ORDER.filter(g=>g!=='חימום וניידות')]:CAT_ORDER;
  let h=`<button class="pick new" onclick="modal.form=true;renderModal()">✏️ תרגיל חדש${q?`: "${esc(modal.q.trim())}"`:''}</button>`;
  order.forEach(g=>{
    const l=S.exercises.filter(e=>(e.grp||'אחר')===g&&filt(e)&&(!q||e.name.toLowerCase().includes(q)||g.includes(q)));
    if(l.length)h+=`<div class="mu pg">${g}</div>`+l.map(e=>`<button class="pick" onclick="pickEx('${e.id}')">${esc(e.name)} ${typeIcon(e.type)}</button>`).join('');
  });
  document.getElementById('plist').innerHTML=h;
}
function pickEx(id){
  const {target,phase}=modal;modal=null;renderModal();
  if(target==='current')addExerciseToCurrent(id,phase);else if(target)planAdd(target,id,phase);else render();
}
function exForm(){
  const d=modal.phase==='w'?'w':'s';
  return `<h2 style="margin-top:0">תרגיל חדש</h2>
  <input id="fn" placeholder="שם התרגיל" value="${esc(modal.q.trim())}">
  <div class="grid2"><select id="fty">${[['s','כוח (משקל וחזרות)'],['t','זמן (שניות)'],['c','קרדיו (זמן ומרחק)'],['w','חימום (זמן)']].map(([v,l])=>`<option value="${v}" ${v===d?'selected':''}>${l}</option>`).join('')}</select>
  <select id="fgr">${CAT_ORDER.map(g=>`<option ${g===(d==='w'?'חימום וניידות':'אחר')?'selected':''}>${g}</option>`).join('')}</select></div>
  <input id="ftip" placeholder="טיפ או הנחיות למכשיר (לא חובה)">
  <div class="row" style="margin-top:10px"><button class="pri grow" onclick="saveExForm()">הוסף</button><button onclick="${modal.target===null?'closeModal()':'modal.form=false;renderModal()'}">חזרה</button></div>`;
}
function saveExForm(){
  const n=document.getElementById('fn').value.trim();if(!n)return toast('הזן שם תרגיל');
  if(S.exercises.some(e=>e.name===n))return toast('כבר יש תרגיל בשם הזה');
  const e={id:uid(),name:n,type:document.getElementById('fty').value,tip:document.getElementById('ftip').value.trim(),grp:document.getElementById('fgr').value,custom:true};
  S.exercises.push(e);save();
  if(modal.target)pickEx(e.id);else{closeModal();render();toast(`"${n}" נוסף לספרייה`)}
}
function planNew(){const p={id:uid(),name:'תוכנית חדשה',days:[],items:[]};S.plans.push(p);openPlan=p.id;save();render()}
const P=id=>S.plans.find(p=>p.id===id);
function planName(id,v){P(id).name=v||'תוכנית';save()}
function planDay(id,d){const p=P(id);p.days=p.days.includes(d)?p.days.filter(x=>x!==d):[...p.days,d].sort();save();render()}
function planAdd(id,x,phase){
  if(!x)return;
  const t=ex(x).type,it={ex:x,ph:phase};
  if(phase!=='w'){it.sets=3;it.rest=S.settings.rest||60;if(t==='s')it.reps=goalCfg().min+2;else if(t==='t')it.sec=30;else if(t==='c')it.min=10}
  else it.min=1;
  P(id).items.push(it);save();render();
}
/* שורת תרגיל בעורך תוכנית: סטים, חזרות/זמן והפסקה */
function planRow(p,it,i){
  const t=ex(it.ex).type;
  const f=(k,l,v)=>`<div><label>${l}</label><input type="number" inputmode="numeric" value="${v??''}" onchange="planSet('${p.id}',${i},'${k}',this.value)"></div>`;
  const cols=it.ph==='w'?f('min','דקות',it.min):
    t==='s'?f('sets','סטים',it.sets)+f('reps','חזרות',it.reps)+f('rest','הפסקה (ש׳)',it.rest):
    t==='t'?f('sets','סטים',it.sets)+f('sec','שניות',it.sec)+f('rest','הפסקה (ש׳)',it.rest):
    t==='c'?f('sets','סטים',it.sets)+f('min','דקות',it.min)+f('rest','הפסקה (ש׳)',it.rest):f('min','דקות',it.min);
  return `<div class="pit"><div class="row sp"><b>${fmtName(ex(it.ex).name)}</b><span><button class="sm" onclick="planMove('${p.id}',${i},-1)">↑</button> <button class="sm" onclick="planMove('${p.id}',${i},1)">↓</button> <button class="sm dg" onclick="planDel('${p.id}',${i})">✕</button></span></div><div class="g3">${cols}</div></div>`;
}
function planSet(id,i,k,v){P(id).items[i][k]=v===''?undefined:+v;save()}
function planMove(id,i,d){
  const a=P(id).items,phs=a[i].ph||'m';let j=i+d;
  while(j>=0&&j<a.length&&(a[j].ph||'m')!==phs)j+=d;
  if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render();
}
function planDel(id,i){P(id).items.splice(i,1);save();render()}
function planRemove(id){if(confirm('למחוק את התוכנית?')){S.plans=S.plans.filter(p=>p.id!==id);openPlan=null;save();render()}}
function exDel(id){
  if(S.plans.some(p=>p.items.some(i=>i.ex===id))||S.workouts.some(w=>w.entries.some(e=>e.exId===id)))return toast('התרגיל בשימוש בתוכנית או בהיסטוריה, אי אפשר למחוק');
  S.exercises=S.exercises.filter(e=>e.id!==id);save();render();
}

function vProgress(){
  const strength=S.exercises.filter(e=>(e.type==='s'||e.type==='t')&&S.workouts.some(w=>w.entries.some(x=>x.exId===e.id&&ph(x)==='m')));
  if(!histEx||!strength.find(e=>e.id===histEx))histEx=strength[0]&&strength[0].id;
  let h=`<h1>התקדמות</h1>`;
  if(!S.workouts.length)return h+`<div class="empty">עוד אין אימונים. סיים אימון ראשון והגרפים יופיעו כאן 📈</div>`;
  // נפח שבועי: סטים לכל קבוצת שרירים מול היעד של המטרה שבחרת
  const g=goalCfg(),[lo,hi]=g.vol,vs=weeklySets(startOfWeek(Date.now()));
  const groups=['חזה','גב','כתפיים','ידיים','רגליים','ישבן','בטן וליבה',...Object.keys(vs).filter(k=>!['חזה','גב','כתפיים','ידיים','רגליים','ישבן','בטן וליבה'].includes(k))];
  h+=`<div class="card"><b>נפח השבוע</b><div class="mu" style="margin-bottom:6px">סטים לכל קבוצת שרירים. היעד ל${g.l}: ${lo}–${hi} סטים בשבוע</div>${groups.map(k=>{const n=vs[k]||0;return `<div class="vol"><span>${k}</span><div class="bar"><i class="${n<lo?'lo':n>hi?'hi':''}" style="width:${Math.min(100,n/hi*100)}%"></i></div><span class="mu">${n}/${lo}${n>=lo&&n<=hi?' ✔':''}</span></div>`}).join('')}</div>`;
  h+=weeksChart();
  if(S.body.length)h+=`<div class="card"><b>משקל גוף</b><div class="mu" style="margin:4px 0 8px">אחרון: ${S.body[S.body.length-1].kg} ק"ג${S.body.length>1?` · שינוי מההתחלה: ${(S.body[S.body.length-1].kg-S.body[0].kg>0?'+':'')+(S.body[S.body.length-1].kg-S.body[0].kg).toFixed(1)} ק"ג`:''}</div>${chart(S.body.map(b=>({t:new Date(b.d+'T12:00:00').getTime(),v:b.kg})))}</div>`;
  if(histEx){
    // תרגיל עם משקל: 1RM משוער. משקל גוף בלבד: מקסימום חזרות. תרגיל זמן: מקסימום שניות
    const he=ex(histEx),weighted=he.type==='s'&&S.workouts.some(w=>w.entries.some(e=>e.exId===histEx&&ph(e)==='m'&&e.sets.some(s=>!isBW(s))));
    const pts=S.workouts.map(w=>{let b=0;w.entries.forEach(e=>{if(e.exId===histEx&&ph(e)==='m')e.sets.forEach(s=>{if(he.type==='t'||isBW(s)!==weighted)b=Math.max(b,setScore(he,s))})});return b?{t:w.start,v:b}:null}).filter(Boolean);
    const label=he.type==='t'?'משך מקסימלי בשניות':weighted?'1RM משוער (נוסחת Epley, ללא חימום)':'מקסימום חזרות (משקל גוף)';
    h+=`<div class="card"><select onchange="histEx=this.value;render()">${strength.map(e=>`<option value="${e.id}" ${e.id===histEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <div class="mu" style="margin:8px 0">${label}</div>${chart(pts)}</div>`;
  }
  h+=`<h2>היסטוריה</h2>`+S.workouts.slice().reverse().slice(0,30).map(w=>{
    const vol=volume(w),min=Math.round((w.end-w.start)/6e4),warm=w.entries.filter(e=>ph(e)==='w'),main=w.entries.filter(e=>ph(e)==='m');
    const line=e=>{const x=ex(e.exId);return esc(x.name)+' '+(x.type==='s'?e.sets.length+' סטים':x.type==='t'?e.sets.length+' סטים · עד '+Math.max(0,...e.sets.map(s=>+s.sec||0))+' שנ׳':x.type==='c'?e.sets.reduce((a,s)=>a+(s.km||0),0).toFixed(1)+' ק"מ':e.sets.reduce((a,s)=>a+(s.min||0),0)+' דק׳')};
    return `<div class="card"><div class="row sp"><b>${esc(w.name)}</b><span class="mu">${fmtDate(w.start)} · ${min} דק׳</span></div>
    ${warm.length?`<div class="mu">🔥 חימום: ${warm.map(line).join(' · ')}</div>`:''}
    <div class="mu">💪 ${main.map(line).join(' · ')}</div>
    <div class="mu">${vol?`נפח כולל: ${Math.round(vol).toLocaleString()} ק"ג · `:''}🔥 כ-${kcal(w)} קל׳</div>
    ${w.verdict?`<div class="fb ${w.verdict.t}">${esc(w.verdict.m)}</div>`:''}
    <div class="row"><button class="sm" onclick="editWorkout('${w.id}')">✏️ ערוך</button><button class="sm" onclick="shareWorkout('${w.id}')">📤 שתף</button><button class="sm dg" onclick="delWorkout('${w.id}')">מחק</button></div></div>`}).join('');
  return h;
}
function delWorkout(id){if(confirm('למחוק את האימון?')){S.workouts=S.workouts.filter(w=>w.id!==id);save();render()}}
function chart(p){
  if(p.length<2)return `<div class="empty">צריך לפחות 2 אימונים לגרף</div>`;
  const W=320,H=140,pad=24,min=Math.min(...p.map(x=>x.v))*.95,max=Math.max(...p.map(x=>x.v))*1.02,t0=p[0].t,t1=p[p.length-1].t||1;
  const X=t=>pad+(t-t0)/(t1-t0||1)*(W-pad*2),Y=v=>H-pad-(v-min)/(max-min||1)*(H-pad*2);
  return `<svg viewBox="0 0 ${W} ${H}"><polyline fill="none" stroke="var(--ac)" stroke-width="2.5" points="${p.map(x=>X(x.t)+','+Y(x.v)).join(' ')}"/>
  ${p.map(x=>`<circle cx="${X(x.t)}" cy="${Y(x.v)}" r="3.5" fill="var(--ac)"/>`).join('')}
  <text x="${pad}" y="12" fill="var(--mu)" font-size="11">${Math.round(max)}</text><text x="${pad}" y="${H-6}" fill="var(--mu)" font-size="11">${Math.round(min)}</text>
  <text x="${W-pad}" y="${H-6}" fill="var(--mu)" font-size="11" text-anchor="end">${fmtDate(t1)}</text></svg>`;
}

function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function exportJSON(){dl(`gymtrack-backup-${ymd(Date.now())}.json`,JSON.stringify(S),'application/json');S.settings.lastBackup=Date.now();save();render()}
function exportCSV(){
  const rows=[['date','workout','phase','exercise','set','weight_kg','reps','seconds','minutes','km']];
  S.workouts.forEach(w=>w.entries.forEach(e=>e.sets.forEach((s,i)=>rows.push([new Date(w.start).toISOString().slice(0,10),w.name,ph(e)==='w'?'warmup':'main',ex(e.exId).name,i+1,s.w??'',s.r??'',s.sec??'',s.min??'',s.km??'']))));
  dl('gymtrack.csv','﻿'+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
}
/* ייבוא מחליף את כל הנתונים: מבקשים אישור, ולפני ההחלפה מורידים גיבוי של המצב הנוכחי */
function importJSON(f){
  if(!f)return;
  f.text().then(t=>{
    let d;try{d=JSON.parse(t);if(!d.exercises)throw 0}catch(e){return toast('קובץ לא תקין')}
    const n=(d.workouts||[]).length;
    if(S.workouts.length&&!confirm(`הייבוא יחליף את כל הנתונים הנוכחיים (${S.workouts.length} אימונים) בנתונים מהקובץ (${n} אימונים).\nלפני ההחלפה יורד אוטומטית גיבוי של המצב הנוכחי. להמשיך?`))return;
    if(S.workouts.length)dl(`gymtrack-before-import-${ymd(Date.now())}.json`,JSON.stringify(S),'application/json');
    S=normalize(d);S.settings.lastBackup=Date.now();save();render();toast(`יובא בהצלחה: ${n} אימונים`);
  }).finally(()=>{const i=document.getElementById('imp');if(i)i.value=''});
}
function wipe(){if(confirm('למחוק את כל הנתונים?')){localStorage.removeItem(KEY);idb('readwrite',st=>st.delete(KEY)).catch(()=>{});S=normalize(null);save();render()}}
function seed(){
  const id=n=>S.exercises.find(e=>e.name===n).id;
  S.plans=[{id:uid(),name:'דחיפה',days:[0,3],items:[{ex:id('ריצה קלה'),ph:'w'},{ex:id('סיבובי כתפיים'),ph:'w'},{ex:id('לחיצת חזה'),ph:'m'},{ex:id('לחיצת כתפיים'),ph:'m'}]},
           {id:uid(),name:'משיכה ורגליים',days:[1,4],items:[{ex:id('ריצה קלה'),ph:'w'},{ex:id('גשר גלוטאוס'),ph:'w'},{ex:id('סקוואט'),ph:'m'},{ex:id('חתירה במוט'),ph:'m'},{ex:id('מתח'),ph:'m'}]}];
  S.workouts=[];const now=Date.now();
  for(let w=5;w>=0;w--)for(const d of [1,3,5]){
    const t=now-(w*7+d)*864e5;if(t>now)continue;
    S.workouts.push({id:uid(),start:t,end:t+55*6e4,name:d===3?'דחיפה':'משיכה ורגליים',entries:[
      {exId:id('ריצה קלה'),ph:'w',sets:[{min:5,done:true}]},
      {exId:id(d===3?'לחיצת חזה':'סקוואט'),ph:'m',sets:[0,1,2].map(()=>({w:(d===3?50:70)+(5-w)*2.5,r:8,done:true}))},
      {exId:id('ריצה'),ph:'m',sets:[{min:25+(5-w),km:4.5+(5-w)*.2,done:true}]}]});
  }
  S.workouts.sort((a,b)=>a.start-b.start);
  const t=ymd(Date.now());
  S.cal=[{id:uid(),title:'חג לדוגמה',start:addDays(t,3),end:addDays(t,3),kind:'holiday'},{id:uid(),title:'חופשה באילת',start:addDays(t,5),end:addDays(t,9),kind:'vacation'}];
  save();render();toast('נטענו נתוני דוגמה');
}

function dailyCard(){

function addWater(n){const d=ymd(Date.now());S.water[d]=Math.max(0,(S.water[d]||0)+n);if(n>0&&S.water[d]===(S.settings.waterGoal||8))toast('💧 עמדת ביעד המים של היום!');save();render()}
function logWeight(v){
  const kg=parseFloat(v),d=ymd(Date.now());if(!(kg>20&&kg<400))return toast('הזן משקל בק"ג');
  S.body=S.body.filter(b=>b.d!==d);S.body.push({d,kg});S.body.sort((a,b)=>a.d<b.d?-1:1);
  const prev=S.body.length>1?S.body[S.body.length-2]:null;
  save();render();toast(prev?`⚖️ נשמר: ${kg} ק"ג (${kg-prev.kg>=0?'+':''}${(kg-prev.kg).toFixed(1)} מהשקילה הקודמת)`:`⚖️ נשמר: ${kg} ק"ג`);
}
/* הערכת קלוריות לפי MET: אימון כוח ~5, קרדיו ~8, לפי משקל הגוף האחרון (ברירת מחדל 75 ק"ג). הערכה בלבד */
function kcal(w){
  const bw=S.body.length?S.body[S.body.length-1].kg:75,total=Math.max(1,(w.end||Date.now())-w.start)/6e4;
  const cardio=w.entries.reduce((a,en)=>ex(en.exId).type==='c'?a+en.sets.reduce((b,s)=>b+(+s.min||0),0):a,0);
  const strength=Math.min(120,Math.max(0,total-cardio));
  return Math.round((5*strength+8*Math.min(cardio,total))/60*bw);
}
/* אימונים בשבוע ב-8 השבועות האחרונים, מול היעד */
function weeksChart(){
  const wk=startOfWeek(Date.now()),weeks=Array.from({length:8},(_,i)=>wk-(7-i)*7*864e5);
  const counts=weeks.map(w=>S.workouts.filter(x=>x.start>=w&&x.start<w+7*864e5).length),goal=S.settings.goal,mx=Math.max(goal,...counts,1);
  const W=320,H=120,bw=W/8;

  <line x1="0" x2="${W}" y1="${H-goal/mx*H}" y2="${H-goal/mx*H}" stroke="var(--mu)" stroke-dasharray="4 4"/></svg></div>`;
}
/* הכרזה קולית: מה הסט הבא */
function announceNext(){
  if(S.settings.voice===false||!window.speechSynthesis||!S.current)return;
  let txt='המנוחה נגמרה';
  for(const en of S.current.entries){
    const s=en.sets.find(x=>!x.done);if(!s)continue;
    const e=ex(en.exId);
    txt+=`. סט הבא: ${e.name.replace(/\(.*?\)/g,'')}`+(e.type==='s'?(+s.w>0?`, ${s.w} קילו`:'')+(s.r?`, ${s.r} חזרות`:''):e.type==='t'&&s.sec?`, ${s.sec} שניות`:'');
    break;
  }
  try{const u=new SpeechSynthesisUtterance(txt);u.lang='he-IL';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
/* שיתוף סיכום אימון (Web Share, ואם אין: העתקה ללוח) */
function shareWorkout(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return;
  const main=w.entries.filter(e=>ph(e)==='m').map(en=>{const e=ex(en.exId),best=en.sets.reduce((a,s)=>setScore(e,s)>setScore(e,a)?s:a,en.sets[0]);return `• ${e.name}: ${en.sets.length} סטים${e.type==='s'||e.type==='t'?`, הכי טוב ${fmtSet(e,best)}`:''}${en.sets.some(s=>s.pr)?' 🏆':''}`}).join('\n');
  const vol=volume(w),text=`💪 ${w.name} · ${fmtDate(w.start)}\n${main}\n${vol?`נפח: ${Math.round(vol).toLocaleString()} ק"ג · `:''}⏱ ${Math.round((w.end-w.start)/6e4)} דק׳ · 🔥 כ-${kcal(w)} קל׳\n🔥 ${streak()} שבועות ברצף\n— GymTrack`;
  if(navigator.share)navigator.share({text}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast('📋 הסיכום הועתק, אפשר להדביק בוואטסאפ'));
}

const SPL={
 FB:['גוף מלא',['quads','push','pull','hinge','shoulders','core','arms']],
 UP:['פלג גוף עליון',['push','pull','shoulders','arms','push','pull','core']],

};
const SEQ={2:['FB','FB'],3:['FB','FB','FB'],4:['UP','LOW','UP','LOW'],5:['PUSH','PULL','LEG','UP','CORE'],6:['PUSH','PULL','LEG','PUSH','PULL','LEG']};
const WARM_SPEC={UP:['סיבובי כתפיים'],PUSH:['סיבובי כתפיים'],PULL:['משיכת גומייה (Band Pull-Apart)','סיבובי כתפיים'],LOW:['גשר גלוטאוס','סיבובי אגן וירכיים'],LEG:['גשר גלוטאוס','סיבובי אגן וירכיים'],FB:['סיבובי כתפיים','גשר גלוטאוס'],CORE:['חתול-גמל','ציפור-כלב (Bird Dog)']};

/* זמן משוער (דקות) לרשימת תרגילי תכנית */
function estMin(items){
  let m=0;
  items.forEach(it=>{
    const e=ex(it.ex),n=it.sets||1;
    if(it.ph==='w')m+=(it.min||1);
    else if(e.type==='c')m+=(it.min||10)*n;
    else if(e.type==='t')m+=n*((it.sec||30)+(it.rest||30))/60;
    else m+=n*(40+(it.rest||60))/60;
  });
  return Math.round(m);
}
function genPlans(a){
  const days=a.days.slice().sort((x,y)=>x-y).slice(0,6),n=Math.max(2,days.length);
  const pu=+a.pushups||0,lv=a.level,goal=a.goal,place=a.place,dur=+a.dur||30;
  let [sets,reps,rest]={muscle:[3,10,75],lose:[3,15,30],abs:[3,15,40],strength:[4,6,120],fit:[3,12,45]}[goal]||[3,12,45];
  if(lv==='new'){sets=Math.max(2,sets-1);reps=Math.max(6,reps-2);rest+=10}
  if(lv==='adv'){sets=Math.min(5,sets+1);reps+=2}
  if(place==='bw'){reps=[8,12,16,20][pu]+(goal==='lose'?2:0)+(lv==='adv'?2:0);if(goal==='strength')reps=Math.max(6,reps-2)}
  rest=Math.max(15,Math.round(rest*({short:.7,normal:1,long:1.4}[a.rest]||1)/5)*5);
  const tsec=lv==='new'?30:lv==='adv'?50:40,csec=tsec+(goal==='lose'?10:0);
  const banned=new Set([].concat(...(a.limits||[]).map(l=>BAN[l]||[])));
  const byName=nm=>S.exercises.find(e=>e.name===nm);
  const pool=pat=>((pat==='push'&&place==='bw'&&pu===0)?EQP.bw.pushE:(EQP[place][pat]||[])).filter(nm=>!banned.has(nm)&&byName(nm));
  const mk=(nm,pat)=>{
    const e=byName(nm),t=e.type,core=pat==='core',car=pat==='cardio';
    const r=Math.max(20,Math.round((core||car?rest*.6:(pat==='arms'||pat==='shoulders'||pat==='calves')?rest*.8:rest)/5)*5);
    const it={ex:e.id,ph:'m',sets:(car&&t==='c')?1:sets,rest:r};
    if(t==='s')it.reps=core?(goal==='strength'?12:15):pat==='calves'?Math.max(reps,15):((pat==='arms'||pat==='shoulders')&&place!=='bw')?Math.max(reps,10):reps;
    else if(t==='t')it.sec=car?csec:tsec;
    else if(t==='c')it.min=Math.max(8,Math.min(20,Math.round((dur-10)/3)));
    return it;
  };
  const warm=k=>{
    const out=[],add=(nm,min)=>{const e=nm&&byName(nm);if(e&&!banned.has(nm)&&!out.some(x=>x.ex===e.id))out.push({ex:e.id,ph:'w',min,sets:1,rest:10})};
    add(place==='bw'?'קפיצות פיסוק (Jumping Jacks)':'ריצה קלה',place==='bw'?1:3);
    if(!out.length)add(place==='bw'?'מתיחות דינמיות':'אופניים קלים',2);
    add('מתיחות דינמיות',1);
    (WARM_SPEC[k]||[]).forEach(nm=>add(nm,1));
    return out;
  };
  const seq=SEQ[Math.min(6,n)],occ={},tot={};seq.forEach(k=>tot[k]=(tot[k]||0)+1);
  const plans=seq.map((k,idx)=>{
    const [nm,base]=SPL[k],o=occ[k]=(occ[k]??-1)+1;
    const wu=warm(k),wmin=wu.reduce((s,x)=>s+x.min,0);
    const perEx=sets*(0.7+rest/60);
    const count=Math.max(3,Math.min(9,Math.round((dur-wmin)/perEx)));
    const allowed=new Set(base),extra=(a.focus||[]).filter(f=>f!=='full'&&(allowed.has(f)||f==='core'));
    let queue=base.slice();
    if(goal==='abs')queue.splice(Math.min(3,queue.length),0,'core','core');
    queue=queue.concat(extra);
    const fin=(goal==='lose'&&k!=='CORE')?['cardio','cardio']:[];
    queue=queue.slice(0,Math.max(1,count-fin.length)).concat(fin);
    const used=new Set(),items=[],cnt={};
    queue.forEach(pat=>{
      const pl=pool(pat);if(!pl.length)return;
      const c=cnt[pat]=(cnt[pat]??-1)+1;
      for(let t=0;t<pl.length;t++){const x=pl[(o+c+t)%pl.length];if(!used.has(x)){used.add(x);items.push(mk(x,pat));break}}
    });
    // רשת ביטחון: לפחות 3 תרגילים גם כשהמגבלות פסלו הרבה (משלימים מתרגילים בטוחים)
    const FALL=['core','hinge','quads','calves','pull','push'];
    for(let g=0;g<24&&items.length<3;g++){const pat=FALL[g%FALL.length],x=pool(pat).find(q=>!used.has(q));if(x){used.add(x);items.push(mk(x,pat))}}
    // השלמה לזמן המבוקש: אם הפיצול יצא קצר (למשל כי מגבלות פסלו תרגילים), מוסיפים עוד תרגילים
    const nonCar=queue.filter(p=>p!=='cardio'),pats=nonCar.length?nonCar:queue;
    for(let g=0;g<40&&items.length<10&&estMin([...wu,...items])<dur-3;g++){
      const pat=pats[g%pats.length],x=pool(pat).find(q=>!used.has(q));
      if(x){used.add(x);items.push(mk(x,pat))}
    }
    // אם האימון ארוך מהמבוקש: מקצרים קודם סטים (עד 2), ואז הפסקות (עד 30 שניות)
    for(let g=0;g<8&&estMin([...wu,...items])>dur+4;g++){
      let ch=false;
      items.forEach(it=>{if(it.sets>2&&ex(it.ex).type!=='c'){it.sets--;ch=true}});
      if(!ch)items.forEach(it=>{if(it.rest>30){it.rest-=10;ch=true}});
      if(!ch)break;
    }
    // אם נגמרו התרגילים האפשריים והאימון עדיין קצר מהמבוקש, מוסיפים סט לכל תרגיל (עד 5)
    for(let g=0;g<3&&estMin([...wu,...items])<dur-5;g++)items.forEach(it=>{if(it.sets&&ex(it.ex).type!=='c'&&it.sets<5)it.sets++});
    const letter=tot[k]>1?' '+['א׳','ב׳','ג׳'][o]:'';
    return {id:uid(),gen:true,tag:({FB:'גוף',UP:'עליון',LOW:'תחתון',PUSH:'דחיפה',PULL:'משיכה',LEG:'רגליים',CORE:'בטן'}[k])+letter,name:nm+letter,days:[days[idx]??days[days.length-1]],items:[...wu,...items]};
  });
  return {plans,rest};
}

/* לוח תכנית ל-4 שבועות */
function programGrid(){
  if(!S.profile||!S.plans.some(p=>p.gen))return '';
  const st=S.profile.start,wkg=S.body.length?S.body[S.body.length-1].kg:(+S.profile.weight||75);
  const cur=Math.max(0,Math.min(3,Math.floor((Date.now()-st)/(7*864e5))));
  let h=`<div class="card"><b>🗓️ תכנית 4 שבועות</b><div class="mu" style="margin-bottom:4px">✔ מסמן אימון שבוצע. המשקלים והחזרות מתעדכנים לבד לפי מה שרשמת.</div>`;
  for(let w=0;w<4;w++){
    let kc=0;
    const tiles=DAYS.map((dn,d)=>{
      const dt=new Date(st);dt.setDate(dt.getDate()+w*7+d);const ds=ymd(dt);
      const p=S.plans.find(x=>x.gen&&x.days.includes(d));
      if(!p)return `<div class="wk rest">${dn}<br>😴</div>`;
      kc+=Math.round(5.5*wkg*estMin(p.items)/60);
      const done=S.workouts.some(x=>ymd(x.start)===ds&&(x.planId===p.id||String(x.name).startsWith(p.name)));
      return `<div class="wk ${done?'on':''}">${dn}<br>${done?'✔':esc(p.tag||p.name.split(' ')[0])}</div>`;
    }).join('');
    h+=`<div class="row sp" style="margin-top:8px"><b>שבוע ${w+1}${w===cur?' · עכשיו':''}</b><span class="mu">🔥 ~${kc} קק"ל</span></div><div class="wkgrid">${tiles}</div>`;
  }
  return h+`<button class="sm" style="margin-top:6px" onclick="exportPlanICS()">📅 הוסף תזכורות ליומן (ICS)</button></div>`;
}
function exportPlanICS(){
  const h={morning:7,noon:13,evening:19}[S.profile&&S.profile.time]||19,dur=(S.profile&&+S.profile.dur)||45;
  const pad=n=>String(n).padStart(2,'0'),fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
  const stamp=new Date().toISOString().replace(/[-:]|\.\d{3}/g,''),ev=[];
  S.plans.forEach(p=>p.days.forEach(day=>{
    const d=new Date();d.setHours(h,0,0,0);d.setDate(d.getDate()+((day-d.getDay()+7)%7));
    if(d<Date.now())d.setDate(d.getDate()+7);
    ev.push(['BEGIN:VEVENT','UID:'+p.id+'-'+day+'@gymtrack','DTSTAMP:'+stamp,'DTSTART:'+fmt(d),'DTEND:'+fmt(new Date(d.getTime()+dur*6e4)),'RRULE:FREQ=WEEKLY;COUNT=12','SUMMARY:💪 אימון: '+p.name,'BEGIN:VALARM','TRIGGER:-PT30M','ACTION:DISPLAY','DESCRIPTION:אימון בעוד 30 דקות','END:VALARM','END:VEVENT'].join('\r\n'));
  }));
  if(!ev.length)return toast('אין ימים קבועים בתוכניות');
  dl('gymtrack-workouts.ics',['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GymTrack//HE','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n'),'text/calendar');
  toast('הקובץ ירד. פתח אותו כדי להוסיף לכל יומן');
}
/* תזכורת מנוחה אחרי 3 ימי אימון ברצף */
function restTip(){
  const day=864e5;
  return [0,1,2].every(d=>S.workouts.some(w=>ymd(w.start)===ymd(Date.now()-d*day)))
    ?`<div class="banner"><b>🛌 יום מנוחה</b><div class="mu">אימנת 3 ימים ברציפות. גם שרירים צריכים התאוששות, מומלץ לנוח היום.</div></div>`:'';
}

/* =====================================================================
   נגן אימון מודרך: ספירה לאחור, טיימר, הפסקות, חיווי ותחושה אחרי כל סט.
   עובד על אותו אימון פעיל (S.current), כך שהכל נשמר ונספר כמו בטבלה
   ===================================================================== */
let PL=null,plIv=null;
const snd=()=>S.settings.sound!==false;
const voiceOn=()=>S.settings.voice!==false;
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function tone(f,d){
  if(!snd())return;
  try{unlockAudio();if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;g.gain.value=.15;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d/1000)}catch(e){}
}
function speak(t){if(!voiceOn()||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';u.rate=1.05;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const isTimed=e=>e.type==='t'||e.type==='w'||e.type==='c';
function steps(){
  const en=S.current.entries,idx=en.map((e,i)=>i).sort((a,b)=>((ph(en[a])==='w')?0:1)-((ph(en[b])==='w')?0:1)||a-b),out=[];
  idx.forEach(i=>en[i].sets.forEach((s,j)=>out.push({i,j})));return out;
}
function cur(){const st=steps()[PL.k];if(!st)return null;const en=S.current.entries[st.i];return {i:st.i,j:st.j,en,s:en.sets[st.j],e:ex(en.exId)}}
const durSec=c=>c.e.type==='t'?(c.s.sec||30):Math.round((c.s.min||1)*60);
function playerOpen(){
  if(!S.current||S.current.editId)return;
  unlockAudio();stopRest();
  const st=steps();let k=st.findIndex(x=>!S.current.entries[x.i].sets[x.j].done);if(k<0)k=st.length-1;
  PL={k,st:'ready',end:Date.now()+5000,total:5,left:5,paused:false,lastBeep:-1};
  tone(660,80);speak('התכונן');
  clearInterval(plIv);plIv=setInterval(plTick,200);render();
}
function playerClose(){clearInterval(plIv);PL=null;render()}
function plStartWork(){
  const c=cur();PL.st='work';PL.lastBeep=-1;PL.paused=false;
  // ערכי ברירת מחדל לתרגיל חדש שאין לו עדיין נתונים
  if(c.e.type==='s'&&!c.s.r)c.s.r=goalCfg().min;
  if(c.e.type==='t'&&!(c.s.sec>0))c.s.sec=30;
  if((c.e.type==='c'||c.e.type==='w')&&!(c.s.min>0))c.s.min=c.e.type==='w'?3:10;
  if(isTimed(c.e)){PL.total=durSec(c);PL.end=Date.now()+PL.total*1000;PL.left=PL.total}
  speak(c.e.name.replace(/\(.*?\)/g,'')+(c.en.sets.length>1?', סט '+(c.j+1):''));render();
}
function plSetDone(){
  const c=cur();if(!c)return;
  if(!completeSet(c.i,c.j))return;
  // מעתיקים את הערכים לסטים הבאים שעוד ריקים (כמו בטבלה)
  c.en.sets.forEach((x,k)=>{if(k>c.j&&!x.done)['w','r','sec'].forEach(f=>{if(x[f]===''&&c.s[f]!==undefined)x[f]=c.s[f]})});
  save();
  const stp=steps();
  if(PL.k>=stp.length-1){PL.st='done';speak('סיימת את האימון');render();return}
  const nx=S.current.entries[stp[PL.k+1].i];
  const rest=ph(c.en)==='w'?(ph(nx)==='w'?10:30):restFor(c.en);
  PL.st='rest';PL.total=rest;PL.end=Date.now()+rest*1000;PL.left=rest;PL.lastBeep=-1;PL.paused=false;
  speak('מנוחה');render();
}
function plNext(){PL.k++;plStartWork()}
function plAddRest(s){PL.end+=s*1000;PL.total+=s;PL.left+=s}
function plFeel(f){const c=cur();setFeel(c.i,c.j,f)}
function plSkipEx(){
  const stp=steps(),c=cur();let k2=-1;
  for(let k=PL.k+1;k<stp.length;k++)if(stp[k].i!==c.i){k2=k;break}
  if(k2<0){PL.st='done';render();return}
  PL.k=k2;PL.st='ready';PL.total=3;PL.end=Date.now()+3000;PL.left=3;PL.paused=false;render();
}
function plPrev(){
  const target=(PL.st==='rest'||PL.st==='done')?PL.k:PL.k-1;if(target<0)return;
  PL.k=target;const c=cur();c.s.done=false;delete c.s.pr;delete c.s.feel;if(c.en.ask===c.j)delete c.en.ask;c.en.fb=null;save();
  PL.st='ready';PL.total=3;PL.end=Date.now()+3000;PL.left=3;PL.paused=false;render();
}
function plPause(){
  if(!PL.paused){PL.left=Math.max(0,Math.ceil((PL.end-Date.now())/1000));PL.paused=true}
  else{PL.end=Date.now()+PL.left*1000;PL.paused=false}
  render();
}
function plAdj(f,d){const c=cur(),s=c.s;if(f==='r')s.r=Math.max(1,(+s.r||0)+d);else s.w=Math.max(0,Math.round(((+s.w||0)+d)*2)/2);save();render()}
function plFinish(){playerClose();finishWorkout()}
function plTick(){
  if(!PL||!S.current)return;
  const el=document.getElementById('pel');if(el)el.textContent=fmtT(Math.floor((Date.now()-S.current.start)/1000));
  if(PL.paused)return;
  const c=PL.st==='done'?null:cur();if(!c)return;
  if(!(PL.st==='ready'||PL.st==='rest'||(PL.st==='work'&&isTimed(c.e))))return;
  const left=Math.max(0,Math.ceil((PL.end-Date.now())/1000));PL.left=left;
  const t=document.getElementById('pt');if(t)t.textContent=left>=60?fmtT(left):left;
  const r=document.getElementById('ring');if(r)r.setAttribute('stroke-dashoffset',(327*(1-left/Math.max(1,PL.total))).toFixed(1));
  if(left>0&&left<=3&&PL.lastBeep!==left){PL.lastBeep=left;tone(700,90)}
  if(left<=0){
    tone(1100,300);vib(200);
    if(PL.st==='ready')plStartWork();else if(PL.st==='work')plSetDone();else plNext();
  }
}
function ringHtml(label){
  const c=PL.paused?PL.left:Math.max(0,Math.ceil((PL.end-Date.now())/1000));
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--card2)" stroke-width="9"/><circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="${(327*(1-c/Math.max(1,PL.total))).toFixed(1)}" transform="rotate(-90 60 60)"/></svg><div class="t"><span id="pt">${c>=60?fmtT(c):c}</span><small>${label}</small></div></div>`;
}
function targetText(c){
  const t=c.e.type,s=c.s,n=c.en.sets.length;
  if(t==='s')return `${n} סטים × ${s.r||'?'} חזרות${s.w>0?' · '+s.w+' ק"ג':''}`;
  if(t==='t')return `${n} סטים × ${s.sec||30} שניות`;
  return `${s.min||1} דקות`;
}
function vPlayer(){
  const stp=steps(),c=cur();
  const segs=stp.map((x,k)=>`<i class="${S.current.entries[x.i].sets[x.j].done?'d':k===PL.k?'c':''}"></i>`).join('');
  const top=`<div class="row"><button class="sm" onclick="playerClose()" title="חזרה לטבלה">✕</button><div class="segs">${segs}</div><span class="mu" id="pel">0:00</span><button class="sm" onclick="S.settings.sound=!snd();save();render()">${snd()?'🔊':'🔇'}</button><button class="sm" onclick="S.settings.voice=!voiceOn();save();render()">${voiceOn()?'🗣️':'🤐'}</button></div>`;
  if(PL.st==='done'){
    const all=S.current.entries.flatMap(e=>e.sets),d=all.filter(s=>s.done).length,min=Math.max(1,Math.round((Date.now()-S.current.start)/6e4));
    return `<div class="pl">${top}<h1>כל הכבוד! 🎉</h1><div class="stats" style="margin:12px 0"><div class="stat"><b>${d}</b><span class="mu">סטים</span></div><div class="stat"><b>${min}</b><span class="mu">דקות</span></div><div class="stat"><b>~${kcal(S.current)}</b><span class="mu">קק"ל</span></div></div>
    <div class="mu" style="text-align:center">סטים שלא סומנו לא יישמרו באימון</div>
    <button class="pri big" style="margin-top:auto" onclick="plFinish()">✔ שמור וסיים</button><button style="margin-top:6px" onclick="plPrev()">⏮ חזרה לסט האחרון</button></div>`;
  }
  const order=[...new Set(stp.map(x=>x.i))],exN=order.indexOf(c.i)+1,tag=ph(c.en)==='w'?'🔥 חימום':'💪 אימון';
  const meta=`<div class="mu" style="text-align:center">${tag} · תרגיל ${exN}/${order.length} · סט ${c.j+1}/${c.en.sets.length}</div>`;
  const tip=c.e.tip?`<div class="tip">💡 ${esc(c.e.tip)}</div>`:'';
  const sug=(c.en.sug&&c.j===0)?`<div class="sug">🎯 <b>היום:</b> ${esc(c.en.sug)}</div>`:'';
  const nav=`<div class="row" style="margin-top:6px"><button class="grow" onclick="plPrev()">⏮ הקודם</button><button class="grow" onclick="plSkipEx()">⏭ דלג תרגיל</button></div>${c.en.sets.some(s=>s.done)?'':`<select style="padding:8px" onchange="swapEx(${c.i},this.value)"><option value="">🔄 החלף תרגיל…</option>${altOpts(c.en)}</select>`}`;
  if(PL.st==='ready')return `<div class="pl">${top}${meta}<h1>${fmtName(c.e.name)}</h1>${ringHtml('התכונן')}${sug}${tip}<div class="mu" style="text-align:center">${targetText(c)}</div><button class="pri big" style="margin-top:auto" onclick="plStartWork()">▶ התחל עכשיו</button>${nav}</div>`;
  if(PL.st==='rest'){
    const nx=stp[PL.k+1],ne=S.current.entries[nx.i],nE=ex(ne.exId),ns=ne.sets[nx.j];
    return `<div class="pl">${top}<h1>מנוחה 😮‍💨</h1>${ringHtml('עד הסט הבא')}${c.en.fb?`<div class="fb ${c.en.fb.t}">${esc(c.en.fb.m)}</div>`:''}
    ${(c.en.ask===c.j&&c.s.done)?`<div class="mu" style="text-align:center">איך הרגיש הסט?</div><div class="feel">${[1,2,3].map(f=>`<button onclick="plFeel(${f})">${FEEL[f]} ${['','קל','מאתגר','עד הקצה'][f]}</button>`).join('')}</div>`:''}
    <div class="card"><div class="mu">הבא</div><b style="font-size:19px">${fmtName(nE.name)}</b><div class="mu">סט ${nx.j+1}/${ne.sets.length} · ${targetText({e:nE,s:ns,en:ne})}</div></div>
    <div class="row" style="margin-top:auto"><button class="grow big" onclick="plAddRest(20)">+20 ש׳</button><button class="grow big pri" onclick="plNext()">דלג ⏭</button></div></div>`;
  }
  if(isTimed(c.e))return `<div class="pl">${top}${meta}<h1>${fmtName(c.e.name)}</h1>${ringHtml(c.e.type==='t'?'שניות':'')}${tip}
    <div class="row" style="margin-top:auto"><button class="big" style="width:30%" onclick="plPause()">${PL.paused?'▶':'⏸'}</button><button class="pri big" onclick="plSetDone()">✔ סיימתי</button></div>${nav}</div>`;
  const s=c.s,showW=!(S.profile&&S.profile.place==='bw')||s.w>0,pv=lastSets(c.en.exId,ph(c.en)),p=pv&&pv[Math.min(c.j,pv.length-1)];
  return `<div class="pl">${top}${meta}<h1>${fmtName(c.e.name)}</h1>${sug}${tip}
  <div class="stp"><button onclick="plAdj('r',-1)">−</button><b>${s.r||0}</b><button onclick="plAdj('r',1)">+</button></div><div class="mu" style="text-align:center">חזרות</div>
  ${showW?`<div class="stp"><button onclick="plAdj('w',-2.5)">−</button><b style="font-size:40px">${s.w||0}</b><button onclick="plAdj('w',2.5)">+</button></div><div class="mu" style="text-align:center">ק"ג ${s.w>0?'':'(0 = משקל גוף)'}</div>`:''}
  ${p?`<div class="mu" style="text-align:center;margin-top:6px">בפעם הקודמת: ${fmtSet(c.e,p)}</div>`:''}
  <button class="pri big" style="margin-top:auto" onclick="plSetDone()">✔ סיימתי סט</button>${nav}</div>`;
}

/* ---------- shell ---------- */
const TABS=[['today','🏋️','אימון'],['plans','📋','תוכניות'],['progress','📈','התקדמות'],['settings','⚙️','הגדרות']];
function render(){
  if(PL&&!S.current){PL=null;clearInterval(plIv)}
  document.body.classList.toggle('playing',!!PL);document.body.classList.toggle('quiz',tab==='quiz'&&!PL);
  document.getElementById('app').innerHTML=PL?vPlayer():({today:vToday,plans:vPlans,progress:vProgress,settings:vSettings,quiz:vQuiz}[tab]||vToday)();
  document.getElementById('nav').innerHTML=TABS.map(([k,i,l])=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();scrollTo(0,0)"><b>${i}</b>${l}</button>`).join('');
  syncWakeLock();
}
if(!S.profile&&!S.skipQuiz&&!S.workouts.length&&!S.plans.length&&!S.current)quizStart();else render();
if(S.current&&S.current.restEnd>Date.now())resumeRest();
// קודם בודקים אם יש עותק עדכני יותר ב-IndexedDB, ורק אז שומרים, כדי לא לדרוס אותו במצב ריק
restoreFromIDB().then(askPersist).then(()=>{save();render()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
